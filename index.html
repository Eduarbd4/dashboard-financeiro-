<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Financeiro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root {
  --ink: #16233f;
  --paper: #faf7f1;
  --dim: #f1ece2;
  --gold: #bb8a34;
  --sage: #5c7a63;
  --rust: #a8462e;
  --line: #ded6c4;
  --muted: #5c5748;
  --white: #fff;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Inter, sans-serif;
}
.wrap {
  max-width: 1220px;
  margin: auto;
  padding: 28px 24px 50px;
}
.eyebrow {
  font: 11px "IBM Plex Mono";
  color: var(--gold);
  letter-spacing: .08em;
}
.title {
  font: 600 27px Fraunces;
  margin: 3px 0;
}
.sub {
  font: 12px "IBM Plex Mono";
  opacity: .62;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.btn {
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  padding: 9px 14px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: 600;
}
.btn.secondary {
  background: #fff;
  color: var(--ink);
  border-color: var(--line);
}
.btn.danger {
  background: transparent;
  color: var(--rust);
  border-color: var(--rust);
}
.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 20px;
  overflow-x: auto;
}
.tab {
  white-space: nowrap;
  border: 0;
  background: none;
  padding: 11px 15px;
  margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  cursor: pointer;
  font: 12px "IBM Plex Mono";
}
.tab.active {
  color: var(--ink);
  font-weight: 600;
  border-bottom-color: var(--gold);
}
.viewtabs {
  margin-top: -8px;
  margin-bottom: 22px;
}
.viewtabs .tab {
  font-size: 11px;
}
.filterbox {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 22px;
}
.filters {
  display: flex;
  gap: 10px;
  align-items: end;
  flex-wrap: wrap;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 145px;
}
.field label {
  font: 10px "IBM Plex Mono";
  text-transform: uppercase;
  color: var(--muted);
}
.field input,
.field select {
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  padding: 0 9px;
  font: 12px Inter;
}
.compareToggle {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 36px;
  font-size: 12px;
}
.compareDates {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  width: 100%;
  padding-top: 12px;
  margin-top: 4px;
  border-top: 1px solid var(--line);
}
.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}
.kpi {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 5px 13px 5px 13px;
  padding: 18px;
  min-width: 0;
}
.kpi.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.kpi .label {
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  opacity: .7;
}
.kpi .value {
  font: 600 24px Fraunces;
  margin: 8px 0 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.change {
  font: 11px "IBM Plex Mono";
}
.positive {
  color: var(--sage);
}
.negative {
  color: var(--rust);
}
.primary .positive {
  color: #a8d5b0;
}
.primary .negative {
  color: #ffb3a1;
}
.neutral {
  color: var(--muted);
}
.section {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 25px 0 13px;
}
.section h2 {
  font: 600 19px Fraunces;
  margin: 0;
}
.rule {
  height: 1px;
  background: var(--line);
  flex: 1;
}
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 17px;
  margin-bottom: 22px;
  overflow: hidden;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.chart {
  width: 100%;
  overflow-x: auto;
}
.chart svg {
  display: block;
  min-width: 620px;
}
.legend {
  display: flex;
  gap: 16px;
  font: 11px "IBM Plex Mono";
  color: var(--muted);
  margin-bottom: 10px;
}
.swatch {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  display: inline-block;
  margin-right: 5px;
}
.tablewrap {
  overflow-x: auto;
}
.table {
  width: 100%;
  border-collapse: collapse;
  min-width: 680px;
}
.table th,
.table td {
  text-align: right;
  padding: 12px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.table th:first-child,
.table td:first-child {
  text-align: left;
}
.table th {
  font: 10px "IBM Plex Mono";
  text-transform: uppercase;
  color: var(--muted);
}
.analysis {
  line-height: 1.65;
  font-size: 13px;
}
.analysisLead {
  font: 600 17px Fraunces;
  margin-bottom: 12px;
}
.analysisList {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.insight {
  background: var(--dim);
  border-radius: 7px;
  padding: 11px;
}
.empty {
  text-align: center;
  max-width: 680px;
  margin: 45px auto;
}
.drop {
  border: 2px dashed var(--line);
  border-radius: 12px;
  padding: 38px 20px;
  cursor: pointer;
}
.drop.over {
  border-color: var(--gold);
  background: var(--dim);
}
.error {
  color: var(--rust);
  font-size: 12px;
  margin: 10px;
}
.ranking {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 9px 0;
}
.rankname {
  width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}
.track {
  height: 22px;
  background: var(--dim);
  border-radius: 4px;
  flex: 1;
  overflow: hidden;
}
.fill {
  height: 100%;
  border-radius: 4px;
}
.rankval {
  width: 105px;
  text-align: right;
  font: 11px "IBM Plex Mono";
}
.footer {
  text-align: center;
  font: 10px "IBM Plex Mono";
  opacity: .5;
  margin-top: 28px;
}
input[type=file] {
  display: none;
}
@media (max-width: 800px) {
  .wrap {
    padding: 20px 14px 40px;
  }
  .kpis {
    grid-template-columns: 1fr 1fr;
  }
  .grid2,
  .analysisList {
    grid-template-columns: 1fr;
  }
  .actions {
    width: 100%;
  }
  .actions .btn {
    flex: 1;
  }
  .field {
    flex: 1 1 140px;
  }
  .compareDates .field {
    flex: 1 1 140px;
  }
}
@media (max-width: 450px) {
  .kpis {
    grid-template-columns: 1fr;
  }
  .kpi .value {
    font-size: 22px;
  }
  .filterbox {
    padding: 12px;
  }
  .tabs .tab {
    padding: 10px 12px;
  }
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const MONTHS = [
  "Janeiro",
  "Fevereiro",
  "Março",
  "Abril",
  "Maio",
  "Junho",
  "Julho",
  "Agosto",
  "Setembro",
  "Outubro",
  "Novembro",
  "Dezembro"
];
const ABBR = [
  "jan",
  "fev",
  "mar",
  "abr",
  "mai",
  "jun",
  "jul",
  "ago",
  "set",
  "out",
  "nov",
  "dez"
];
const brl = value =>
  new Intl.NumberFormat("pt-BR", {
    style: "currency",
    currency: "BRL",
    maximumFractionDigits: 0
  }).format(Number(value) || 0);
const pctText = value =>
  Number.isFinite(value)
    ? `${value >= 0 ? "+" : ""}${value.toFixed(1).replace(".", ",")}%`
    : "—";
function node(tag, attrs = {}, children = []) {
  const element = document.createElement(tag);
  Object.entries(attrs).forEach(([key, value]) => {
    if (key.startsWith("on")) {
      element.addEventListener(key.slice(2), value);
    } else if (key === "class") {
      element.className = value;
    } else if (key === "html") {
      element.innerHTML = value;
    } else {
      element.setAttribute(key, value);
    }
  });
  const childList = Array.isArray(children) ? children : [children];
  childList.forEach(child => {
    if (child == null || child === false) return;
    element.appendChild(
      typeof child === "string"
        ? document.createTextNode(child)
        : child
    );
  });
  return element;
}
const normalize = value =>
  (value || "").toString().trim().toLowerCase();
function findColumn(headers, names) {
  const normalizedNames = names.map(normalize);
  return headers.findIndex(header =>
    normalizedNames.includes(normalize(header))
  );
}
function parseNumber(value) {
  if (typeof value === "number") return value;
  let text = (value || "").toString().trim();
  if (
    text.includes(",") &&
    text.lastIndexOf(",") > text.lastIndexOf(".")
  ) {
    text = text.replace(/\./g, "").replace(",", ".");
  }
  const number = parseFloat(text.replace(/[^\d.-]/g, ""));
  return Number.isNaN(number) ? 0 : number;
}
function parseDate(value) {
  if (value instanceof Date) return value;
  if (typeof value === "number" && value > 20000) {
    const converted = new Date(
      Math.round((value - 25569) * 86400000)
    );
    return new Date(
      converted.getUTCFullYear(),
      converted.getUTCMonth(),
      converted.getUTCDate()
    );
  }
  const text = (value || "").toString().trim();
  let match = text.match(
    /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/
  );
  if (match) {
    const year =
      match[3].length === 2
        ? Number(`20${match[3]}`)
        : Number(match[3]);
    return new Date(
      year,
      Number(match[2]) - 1,
      Number(match[1])
    );
  }
  match = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (match) {
    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3])
    );
  }
  return null;
}
function dateToISO(date) {
  if (!date) return "";
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
}
function parseCategory(raw) {
  const text = (raw || "").toString().trim();
  const match = text.match(
    /^(\d+(?:\.\d+)+)\s*[-–.]?\s*(.*)$/
  );
  if (match && match[2]) {
    return {
      code: match[1],
      name: match[2].trim()
    };
  }
  return {
    code: "",
    name:
      text.replace(/^[\d.]+\s*/, "").trim() ||
      "Sem categoria"
  };
}
const CONFIG = {
  pagar: {
    label: "Contas a Pagar",
    sheet: /contas a pagar/i,
    entityHeaders: ["Nome do fornecedor"],
    doneHeaders: [
      "Valor total pago da parcela (R$)"
    ],
    entityLabel: "Fornecedor",
    color: "#16233f"
  },
  receber: {
    label: "Contas a Receber",
    sheet: /contas a receber/i,
    entityHeaders: [
      "Nome do cliente",
      "Nome do contato",
      "Nome do fornecedor"
    ],
    doneHeaders: [
      "Valor total recebido da parcela (R$)",
      "Valor total pago da parcela (R$)"
    ],
    entityLabel: "Cliente",
    color: "#5c7a63"
  }
};
async function parseAccounts(file, key) {
  const config = CONFIG[key];
  const workbook = XLSX.read(
    await file.arrayBuffer(),
    { type: "array" }
  );
  const sheetName =
    workbook.SheetNames.find(name =>
      config.sheet.test(name)
    ) || workbook.SheetNames[0];
  const worksheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(
    worksheet,
    {
      header: 1,
      raw: true,
      defval: ""
    }
  );
  const headerIndex = rows.findIndex(row =>
    config.entityHeaders.some(name =>
      row.some(cell => normalize(cell) === normalize(name))
    )
  );
  if (headerIndex < 0) {
    throw new Error(
      `Não reconheci o relatório de ${config.label}. ` +
      "Exporte novamente pelo Conta Azul sem alterar os cabeçalhos."
    );
  }
  const headers = rows[headerIndex];
  const columns = {
    entity: findColumn(
      headers,
      config.entityHeaders
    ),
    date: findColumn(
      headers,
      ["Data de vencimento"]
    ),
    status: findColumn(
      headers,
      ["Situação"]
    ),
    original: findColumn(
      headers,
      ["Valor original da parcela (R$)"]
    ),
    done: findColumn(
      headers,
      config.doneHeaders
    ),
    open: findColumn(
      headers,
      ["Valor total da parcela em aberto (R$)"]
    ),
    costCenter: findColumn(
      headers,
      ["Centro de Custo 1"]
    )
  };
  if (
    columns.entity < 0 ||
    columns.date < 0 ||
    columns.original < 0
  ) {
    throw new Error(
      "Faltam colunas obrigatórias no arquivo."
    );
  }
  const categoryColumns = [];
  for (let index = 1; index <= 12; index++) {
    const categoryIndex = findColumn(
      headers,
      [`Categoria ${index}`]
    );
    if (categoryIndex >= 0) {
      categoryColumns.push({
        categoryIndex,
        valueIndex: findColumn(
          headers,
          [`Valor na Categoria ${index}`]
        )
      });
    }
  }
  const records = [];
  rows.slice(headerIndex + 1).forEach(row => {
    const date = parseDate(row[columns.date]);
    if (!date) return;
    const original = Math.abs(
      parseNumber(row[columns.original])
    );
    const allocations = [];
    categoryColumns.forEach(categoryColumn => {
      const rawCategory =
        row[categoryColumn.categoryIndex];
      if (!String(rawCategory || "").trim()) return;
      const category = parseCategory(rawCategory);
      allocations.push({
        code: category.code,
        name: category.name,
        value: Math.abs(
          parseNumber(
            row[categoryColumn.valueIndex]
          )
        )
      });
    });
    if (!allocations.length) {
      allocations.push({
        code: "",
        name: "Sem categoria",
        value: original
      });
    } else if (
      !allocations.some(allocation => allocation.value)
    ) {
      allocations[0].value = original;
    }
    const isoDate = dateToISO(date);
    records.push({
      entity:
        String(
          row[columns.entity] ||
          `Sem ${config.entityLabel.toLowerCase()}`
        ).trim(),
      status:
        String(
          row[columns.status] ||
          "Não informado"
        ).trim(),
      original,
      done: Math.abs(
        parseNumber(row[columns.done])
      ),
      open: Math.abs(
        parseNumber(row[columns.open])
      ),
      costCenter:
        columns.costCenter >= 0
          ? String(
              row[columns.costCenter] ||
              "Sem centro de custo"
            ).trim()
          : "Sem centro de custo",
      allocations,
      date: isoDate,
      month: isoDate.slice(0, 7)
    });
  });
  if (!records.length) {
    throw new Error(
      "Nenhum lançamento válido foi encontrado."
    );
  }
  return records;
}
async function parseStatement(file) {
  const workbook = XLSX.read(
    await file.arrayBuffer(),
    { type: "array" }
  );
  const sheetName =
    workbook.SheetNames.find(name =>
      /extrato/i.test(name)
    ) || workbook.SheetNames[0];
  const worksheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(
    worksheet,
    {
      header: 1,
      raw: true,
      defval: ""
    }
  );
  const dateHeaders = [
    "Data",
    "Data do Lançamento",
    "Data Lançamento",
    "Data lançamento"
  ];
  const valueHeaders = [
    "Valor",
    "Valor (R$)",
    "Valor R$",
    "Valor da Transação",
    "Valor da transacao"
  ];
  const headerIndex = rows.findIndex(row =>
    findColumn(row, dateHeaders) >= 0 &&
    findColumn(row, valueHeaders) >= 0
  );
  if (headerIndex < 0) {
    throw new Error(
      "Não reconheci o extrato. " +
      "Preciso das colunas Data e Valor."
    );
  }
  const headers = rows[headerIndex];
  const columns = {
    date: findColumn(headers, dateHeaders),
    value: findColumn(headers, valueHeaders),
    description: findColumn(
      headers,
      [
        "Descrição",
        "Histórico",
        "Descricao",
        "Historico",
        "Complemento",
        "Detalhes"
      ]
    ),
    type: findColumn(
      headers,
      [
        "Tipo",
        "Natureza",
        "D/C",
        "Tipo Lançamento"
      ]
    ),
    balance: findColumn(
      headers,
      [
        "Saldo",
        "Saldo (R$)",
        "Saldo Final",
        "Saldo final"
      ]
    )
  };
  let balance = null;
  const records = [];
  rows.slice(headerIndex + 1).forEach(row => {
    const date = parseDate(row[columns.date]);
    if (!date) return;
    const rawValue = parseNumber(
      row[columns.value]
    );
    const rawType = normalize(
      row[columns.type]
    );
    let type;
    if (rawType.startsWith("d")) {
      type = "saida";
    } else if (rawType.startsWith("c")) {
      type = "entrada";
    } else {
      type = rawValue < 0
        ? "saida"
        : "entrada";
    }
    if (
      columns.balance >= 0 &&
      row[columns.balance] !== ""
    ) {
      balance = parseNumber(
        row[columns.balance]
      );
    }
    const isoDate = dateToISO(date);
    records.push({
      date: isoDate,
      month: isoDate.slice(0, 7),
      value: Math.abs(rawValue),
      type,
      description:
        String(
          row[columns.description] ||
          "Sem descrição"
        ).trim()
    });
  });
  if (!records.length) {
    throw new Error(
      "Nenhum lançamento válido foi encontrado no extrato."
    );
  }
  return {
    records,
    balance
  };
}
function freshFilters() {
  return {
    dateFrom: "",
    dateTo: "",
    month1: "",
    month2: "",
    compare: false,
    period1From: "",
    period1To: "",
    period2From: "",
    period2To: "",
    status: "",
    entity: "",
    category: "",
    costCenter: "",
    type: ""
  };
}
let state = {
  source: "geral",
  view: "dashboard",
  data: {
    pagar: null,
    receber: null,
    extrato: null
  },
  updated: {},
  balance: null,
  error: "",
  filters: freshFilters()
};
function loadSavedData() {
  ["pagar", "receber", "extrato"].forEach(key => {
    try {
      const saved = JSON.parse(
        localStorage.getItem(
          `dashboard-financeiro-${key}-v6`
        )
      );
      if (!saved) return;
      state.data[key] = saved.records;
      state.updated[key] = saved.updated;
      if (key === "extrato") {
        state.balance = saved.balance;
      }
    } catch (error) {
      console.error(
        "Não foi possível recuperar os dados.",
        error
      );
    }
  });
}
function saveData(key) {
  localStorage.setItem(
    `dashboard-financeiro-${key}-v6`,
    JSON.stringify({
      records: state.data[key],
      updated: state.updated[key],
      balance: state.balance
    })
  );
}
function getMonthOptions() {
  const allRecords = Object.values(state.data)
    .filter(Boolean)
    .flat();
  return [
    ...new Set(
      allRecords.map(record => record.month)
    )
  ]
    .sort()
    .map(key => ({
      key,
      label:
        `${MONTHS[Number(key.slice(5)) - 1]}/` +
        key.slice(0, 4)
    }));
}
function baseFilter(records) {
  const filters = state.filters;
  return (records || [])
    .filter(record =>
      !filters.status ||
      record.status === filters.status
    )
    .filter(record =>
      !filters.entity ||
      record.entity === filters.entity
    )
    .filter(record =>
      !filters.costCenter ||
      record.costCenter === filters.costCenter
    )
    .filter(record =>
      !filters.category ||
      record.allocations?.some(
        allocation =>
          allocation.name === filters.category
      )
    )
    .filter(record =>
      !filters.type ||
      record.type === filters.type
    );
}
function periodFilter(records, periodNumber = 0) {
  const filters = state.filters;
  let from = "";
  let to = "";
  let month = "";
  if (filters.compare) {
    from =
      periodNumber === 1
        ? filters.period1From
        : filters.period2From;
    to =
      periodNumber === 1
        ? filters.period1To
        : filters.period2To;
  } else {
    from = filters.dateFrom;
    to = filters.dateTo;
    month =
      periodNumber === 1
        ? filters.month1
        : periodNumber === 2
          ? filters.month2
          : "";
  }
  return baseFilter(records)
    .filter(record =>
      !from || record.date >= from
    )
    .filter(record =>
      !to || record.date <= to
    )
    .filter(record =>
      !month || record.month === month
    );
}
function updateDateFilter(key, value) {
  state.filters[key] = value;
  if (!state.filters.compare && value) {
    const month = value.slice(0, 7);
    if (key === "dateFrom") {
      state.filters.month1 = month;
    }
    if (key === "dateTo") {
      state.filters.month2 = month;
    }
  }

function variation(firstValue, secondValue) {
  if (firstValue === 0) {
    return secondValue === 0 ? 0 : NaN;
  }
  return (
    (secondValue - firstValue) /
    Math.abs(firstValue)
  ) * 100;
}
function calculateMetrics(periodNumber) {
  const receivables = periodFilter(
    state.data.receber,
    periodNumber
  );
  const payables = periodFilter(
    state.data.pagar,
    periodNumber
  );
  const statement = periodFilter(
    state.data.extrato,
    periodNumber
  );
  const revenue = receivables.length
    ? receivables.reduce(
        (sum, record) =>
          sum + record.original,
        0
      )
    : statement
        .filter(record => record.type === "entrada")
        .reduce(
          (sum, record) =>
            sum + record.value,
          0
        );
  const expense = payables.length
    ? payables.reduce(
        (sum, record) =>
          sum + record.original,
        0
      )
    : statement
        .filter(record => record.type === "saida")
        .reduce(
          (sum, record) =>
            sum + record.value,
          0
        );
  const result = revenue - expense;
  const margin = revenue
    ? (result / revenue) * 100
    : 0;
  return {
    revenue,
    expense,
    result,
    margin,
    receivables,
    payables,
    statement
  };
}

function changeElement(
  firstValue,
  secondValue,
  invert = false
) {
  const value = variation(
    firstValue,
    secondValue
  );
  const isGood =
    Number.isFinite(value) &&
    (
      invert
        ? value <= 0
        : value >= 0
    );
  const className =
    !Number.isFinite(value) || value === 0
      ? "neutral"
      : isGood
        ? "positive"
        : "negative";
  const icon =
    !Number.isFinite(value)
      ? "•"
      : value > 0
        ? "↑"
        : value < 0
          ? "↓"
          : "•";
  return node(
    "div",
    {
      class: `change ${className}`
    },
    `${icon} ${pctText(value)}`
  );
}

function renderLineChart(data, field, color) {
  const width = 900;
  const height = 260;
  const left = 62;
  const bottom = 32;
  const top = 18;
  const maximum = Math.max(
    1,
    ...data.map(item =>
      Math.max(0, item[field])
    )
  );
  const gap =
    (width - left - 20) /
    Math.max(1, data.length - 1);
  const svg = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "svg"
  );
  svg.setAttribute(
    "viewBox",
    `0 0 ${width} ${height}`
  );
  let points = "";
  data.forEach((item, index) => {
    const x =
      left +
      (
        data.length === 1
          ? (width - left - 20) / 2
          : index * gap
      );
    const y =
      height -
      bottom -
      (
        (height - bottom - top) *
        (
          Math.max(0, item[field]) /
          maximum
        )
      );
    points += `${x},${y} `;
    const circle = document.createElementNS(
      svg.namespaceURI,
      "circle"
    );
    circle.setAttribute("cx", x);
    circle.setAttribute("cy", y);
    circle.setAttribute("r", 4);
    circle.setAttribute("fill", color);
    const tooltip =
      document.createElementNS(
        svg.namespaceURI,
        "title"
      );
    tooltip.textContent =
      `${item.label}: ${brl(item[field])}`;
    circle.append(tooltip);
    svg.append(circle);
    const text = document.createElementNS(
      svg.namespaceURI,
      "text"
    );
    text.setAttribute("x", x);
    text.setAttribute("y", height - 9);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", "10");
    text.textContent = item.label;
    svg.append(text);
  });
  const line = document.createElementNS(
    svg.namespaceURI,
    "polyline"
  );
  line.setAttribute("points", points);
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width", "3");
  svg.prepend(line);
  return node(
    "div",
    { class: "chart" },
    svg
  );
}
function renderGroupedChart(data) {

  const height = 260;
  const left = 50;
  const bottom = 32;
  const maximum = Math.max(
    1,
    ...data.flatMap(item => [
      item.revenue,
      item.expense
    ])
  );
  const gap =

    Math.max(1, data.length);

  );

        (
          (height - bottom - 18) *

        ) / maximum;
      const x =

        index * gap +
        gap / 2 -
        24 +
        barIndex * 26;
      const rectangle =
        document.createElementNS(
          svg.namespaceURI,
          "rect"
        );

      rectangle.setAttribute(
        "y",

      );

        "height",

      );
      rectangle.setAttribute(
        "fill",

      svg.append(rectangle);

    const text = document.createElementNS(
      svg.namespaceURI,
      "text"
    );
    text.setAttribute(
      "x",
      left + index * gap + gap / 2
    );
    text.setAttribute("y", height - 9);

    text.textContent = item.label;
    svg.append(text);
  });
  return node(
    "div",
    { class: "chart" },
    svg
  );
}
function calculateMonthlyData() {
  const allRecords = Object.values(state.data)
    .filter(Boolean)
    .flat();
  const monthKeys = [
    ...new Set(
      allRecords.map(record => record.month)
    )
  ].sort();
  return monthKeys.map(monthKey => {
    const receivables = baseFilter(
      state.data.receber
    ).filter(
      record => record.month === monthKey
    );
    const payables = baseFilter(
      state.data.pagar
    ).filter(
      record => record.month === monthKey
    );
    const statement = baseFilter(
      state.data.extrato
    ).filter(
      record => record.month === monthKey
    );
    const revenue = receivables.length
      ? receivables.reduce(
          (sum, record) =>
            sum + record.original,
          0
        )
      : statement
          .filter(
            record => record.type === "entrada"
          )
          .reduce(
            (sum, record) =>
              sum + record.value,
            0
          );
    const expense = payables.length
      ? payables.reduce(
          (sum, record) =>
            sum + record.original,
          0
        )
      : statement
          .filter(
            record => record.type === "saida"
          )
          .reduce(
            (sum, record) =>
              sum + record.value,
            0
          );
    return {
      key: monthKey,
      label:
        `${ABBR[Number(monthKey.slice(5)) - 1]}/` +
        monthKey.slice(2, 4),
      revenue,
      expense,
      result: revenue - expense
    };
  });
}

function categoryMap(records) {
  const map = new Map();
  records.forEach(record => {
    record.allocations?.forEach(allocation => {
      map.set(
        allocation.name,
        (
          map.get(allocation.name) || 0
        ) + allocation.value
      );
    });
  });
  return map;
}
function renderAnalysis(
  firstPeriod,
  secondPeriod
) {
  const comparisonEnabled =
    state.filters.compare ||
    (
      state.filters.month1 &&
      state.filters.month2
    );
  if (!comparisonEnabled) {
    return node(
      "div",
      { class: "card analysis" },
      "Selecione dois meses ou ative “Comparar períodos” para ver a análise."
    );
  }
  const resultVariation = variation(
    firstPeriod.result,
    secondPeriod.result
  );
  const firstCategories = categoryMap(
    firstPeriod.payables
  );
  const secondCategories = categoryMap(
    secondPeriod.payables
  );
  const categoryChanges = [
    ...new Set([
      ...firstCategories.keys(),
      ...secondCategories.keys()
    ])
  ]
    .map(category => ({
      category,
      difference:
        (
          secondCategories.get(category) || 0
        ) -
        (
          firstCategories.get(category) || 0
        )
    }))
    .sort(
      (first, second) =>
        second.difference -
        first.difference
    );
  const biggestIncrease =
    categoryChanges.find(
      item => item.difference > 0
    );
  const biggestReduction =
    [...categoryChanges]
      .reverse()
      .find(item => item.difference < 0);
  const biggestImpact =
    [...categoryChanges].sort(
      (first, second) =>
        Math.abs(second.difference) -
        Math.abs(first.difference)
    )[0];
  const labels = getPeriodLabels();
  let resultText =
    "resultado sem base comparável";
  if (Number.isFinite(resultVariation)) {
    resultText =
      `${Math.abs(resultVariation)
        .toFixed(1)
        .replace(".", ",")}% de ` +
      (
        resultVariation >= 0
          ? "melhora"
          : "redução"
      ) +
      " no resultado";
  }
  return node(
    "div",
    {
      class: "card analysis"
    },
    [
      node(
        "div",
        { class: "analysisLead" },
        `${labels[1]} apresentou ${resultText} ` +
        `em relação a ${labels[0]}.`
      ),
      node(
        "div",
        { class: "analysisList" },
        [
          node(
            "div",
            { class: "insight" },
            [
              "Faturamento: ",
              changeElement(
                firstPeriod.revenue,
                secondPeriod.revenue
              )
            ]
          ),
          node(
            "div",
            { class: "insight" },
            [
              "Despesas: ",
              changeElement(
                firstPeriod.expense,
                secondPeriod.expense,
                true
              )
            ]
          ),
          node(
            "div",
            { class: "insight" },
            [
              "Resultado: ",
              changeElement(
                firstPeriod.result,
                secondPeriod.result
              )
            ]
          )
        ]
      ),
      node(
        "p",
        {},
        `Maior aumento de despesa: ${
          biggestIncrease
            ? `${biggestIncrease.category} ` +
              `(${brl(biggestIncrease.difference)})`
            : "nenhum"
        }. Maior redução: ${
          biggestReduction
            ? `${biggestReduction.category} ` +
              `(${brl(
                Math.abs(
                  biggestReduction.difference
                )
              )})`
            : "nenhuma"
        }. Categoria de maior impacto: ${
          biggestImpact
            ? biggestImpact.category
            : "sem dados"
        }.`
      )
    ]
  );
}

          `${currentPeriod.margin
            .toFixed(1)
            .replace(".", ",")}%`,
          firstPeriod.margin,
          secondPeriod.margin
        )
      ]
    )
  );
  if (
    state.source === "pagar" ||
    state.source === "receber"
  ) {
    const config = CONFIG[state.source];
    const selectedPeriod =
      state.filters.compare ||
      state.filters.month2
        ? 2
        : 1;
    const records = periodFilter(
      state.data[state.source],
      selectedPeriod
    );
    const total = records.reduce(
      (sum, record) =>
        sum + record.original,
      0
    );
    const done = records.reduce(
      (sum, record) =>
        sum + record.done,
      0
    );
    const open = records
      .filter(
        record =>
          record.status === "Em aberto"
      )
      .reduce(
        (sum, record) =>
          sum + record.open,
        0
      );
    const late = records
      .filter(
        record =>
          record.status === "Atrasado"
      )
      .reduce(
        (sum, record) =>
          sum + record.open,
        0
      );
    app.append(
      sectionHeader(
        "CONTROLE",
        config.label
      ),
      node(
        "div",
        { class: "kpis" },
        [
          kpiCard(
            "Total no período",
            brl(total),
            0,
            0
          ),
          kpiCard(
            state.source === "pagar"
              ? "Pago"
              : "Recebido",
            brl(done),
            0,
            0
          ),
          kpiCard(
            state.source === "pagar"
              ? "Em aberto"
              : "A receber",
            brl(open),
            0,
            0
          ),
          kpiCard(
            "Atrasado",
            brl(late),
            0,
            0
          )
        ]
      )
    );
  }
  if (state.source === "extrato") {
    const selectedPeriod =
      state.filters.compare ||
      state.filters.month2
        ? 2
        : 1;
    const records = periodFilter(
      state.data.extrato,
      selectedPeriod
    );
    const entries = records
      .filter(
        record => record.type === "entrada"
      )
      .reduce(
        (sum, record) =>
          sum + record.value,
        0
      );
    const exits = records
      .filter(
        record => record.type === "saida"
      )
      .reduce(
        (sum, record) =>
          sum + record.value,
        0
      );
    app.append(
      sectionHeader(
        "EXTRATO",
        "Resumo bancário"
      ),
      node(
        "div",
        { class: "kpis" },
        [
          kpiCard(
            "Entradas",
            brl(entries),
            0,
            0
          ),
          kpiCard(
            "Saídas",
            brl(exits),
            0,
            0
          ),
          kpiCard(
            "Saldo do período",
            brl(entries - exits),
            0,
            0
          ),
          kpiCard(
            "Saldo final",
            state.balance == null
              ? "—"
              : brl(state.balance),
            0,
            0
          )
        ]
      )
    );
  }
  app.append(
    sectionHeader(
      "COMPARAÇÃO",
      "Visão dos períodos"
    ),
    renderComparisonTable(
      firstPeriod,
      secondPeriod
    ),
    sectionHeader(
      "ANÁLISE",
      "Análise do período"
    ),
    renderAnalysis(
      firstPeriod,
      secondPeriod
    )
  );
  if (
    state.source === "pagar" ||
    state.source === "receber"
  ) {
    app.append(
      sectionHeader(
        "RANKING",
        `${CONFIG[state.source].entityLabel}s por valor`
      ),
      renderRanking()
    );
  }
}
function renderDetails(app) {
  const firstPeriod =
    calculateMetrics(1);
  const secondPeriod =
    calculateMetrics(2);
  app.append(
    sectionHeader(
      "DETALHAMENTO",
      "Comparação financeira"
    ),
    renderComparisonTable(
      firstPeriod,
      secondPeriod
    )
  );
  const firstCategories = categoryMap(
    firstPeriod.payables
  );
  const secondCategories = categoryMap(
    secondPeriod.payables
  );
  const categoryNames = [
    ...new Set([
      ...firstCategories.keys(),
      ...secondCategories.keys()
    ])
  ].sort(
    (first, second) =>
      (
        secondCategories.get(second) || 0
      ) -
      (
        secondCategories.get(first) || 0
      )
  );
  const tableHeader = node(
    "thead",
    {},
    node(
      "tr",
      {},
      [
        "Categoria",
        getPeriodLabels()[0],
        getPeriodLabels()[1],
        "Diferença",
        "Variação"
      ].map(value =>
        node("th", {}, value)
      )
    )
  );
  const tableBody = node(
    "tbody",
    {},
    categoryNames.map(category => {
      const firstValue =
        firstCategories.get(category) || 0;
      const secondValue =
        secondCategories.get(category) || 0;
      return node(
        "tr",
        {},
        [
          node("td", {}, category),
          node(
            "td",
            {},
            brl(firstValue)
          ),
          node(
            "td",
            {},
            brl(secondValue)
          ),
          node(
            "td",
            {},
            brl(secondValue - firstValue)
          ),
          node(
            "td",
            {},
            changeElement(
              firstValue,
              secondValue,
              true
            )
          )
        ]
      );
    })
  );
  app.append(
    sectionHeader(
      "CATEGORIAS",
      "Despesas por categoria"
    ),
    node(
      "div",
      {
        class: "card tablewrap"
      },
      node(
        "table",
        { class: "table" },
        [
          tableHeader,
          tableBody
        ]
      )
    )
  );
}
function renderCharts(app) {
  const data = calculateMonthlyData();
  const selectedData = data.filter(item =>
    (
      !state.filters.month1 &&
      !state.filters.month2
    ) ||
    [
      state.filters.month1,
      state.filters.month2
    ].includes(item.key)
  );
  app.append(
    sectionHeader(
      "EVOLUÇÃO",
      "Faturamento por mês"
    ),
    node(
      "div",
      { class: "card" },
      renderLineChart(
        data,
        "revenue",
        "#5c7a63"
      )
    ),
    sectionHeader(
      "COMPARAÇÃO",
      "Receitas x despesas"
    ),
    node(
      "div",
      { class: "card" },
      [
        node(
          "div",
          {
            class: "legend",
            html:
              '<span><i class="swatch" style="background:#5c7a63"></i>Receitas</span>' +
              '<span><i class="swatch" style="background:#a8462e"></i>Despesas</span>'
          }
        ),
        renderGroupedChart(
          selectedData.length
            ? selectedData
            : data
        )
      ]
    ),
    node(
      "div",
      { class: "grid2" },
      [
        node(
          "div",
          {},
          [
            sectionHeader(
              "RESULTADO",
              "Resultado mensal"
            ),
            node(
              "div",
              { class: "card" },
              renderLineChart(
                data,
                "result",
                "#bb8a34"
              )
            )
          ]
        ),
        node(
          "div",
          {},
          [
            sectionHeader(
              "DESPESAS",
              "Evolução mensal"
            ),
            node(
              "div",
              { class: "card" },
              renderLineChart(
                data,
                "expense",
                "#a8462e"
              )
            )
          ]
        )
      ]
    )
  );
}
function renderEmptyArea(source) {
  const label =
    CONFIG[source]?.label ||
    "Extrato Bancário";
  const container = node(
    "div",
    { class: "empty" },
    [
      node(
        "p",
        {},
        `Carregue o arquivo de ${label} para visualizar esta área.`
      )
    ]
  );
  const dropArea = node(
    "div",
    { class: "drop" },
    "⬆ Arraste o arquivo aqui ou clique para escolher"
  );
  const input = node(
    "input",
    {
      type: "file",
      accept: ".xlsx,.xls,.csv",
      onchange: event =>
        uploadFile(
          source,
          event.target.files[0]
        )
    }
  );
  dropArea.onclick = () =>
    input.click();
  dropArea.ondragover = event => {
    event.preventDefault();
    dropArea.classList.add("over");
  };
  dropArea.ondragleave = () =>
    dropArea.classList.remove("over");
  dropArea.ondrop = event => {
    event.preventDefault();
    dropArea.classList.remove("over");
    uploadFile(
      source,
      event.dataTransfer.files[0]
    );
  };
  container.append(
    dropArea,
    input
  );
  return container;
}
async function uploadFile(key, file) {
  if (!file) return;
  try {
    state.error = "";
    if (key === "extrato") {
      const result =
        await parseStatement(file);
      state.data.extrato =
        result.records;
      state.balance =
        result.balance;
    } else {
      state.data[key] =
        await parseAccounts(file, key);
    }
    state.updated[key] =
      new Date().toISOString();
    saveData(key);
  } catch (error) {
    state.error =
      error.message ||
      "Não foi possível ler o arquivo.";
  }
  render();
}
function resetCurrentSource() {
  const key = state.source;
  if (key === "geral") {
    const confirmed = confirm(
      "Apagar todos os dados carregados?"
    );
    if (!confirmed) return;
    [
      "pagar",
      "receber",
      "extrato"
    ].forEach(source => {
      localStorage.removeItem(
        `dashboard-financeiro-${source}-v6`
      );
    });
    state.data = {
      pagar: null,
      receber: null,
      extrato: null
    };
    state.balance = null;
  } else {
    const label =
      CONFIG[key]?.label ||
      "Extrato Bancário";
    const confirmed = confirm(
      `Apagar os dados de ${label}?`
    );
    if (!confirmed) return;
    localStorage.removeItem(
      `dashboard-financeiro-${key}-v6`
    );
    state.data[key] = null;
    if (key === "extrato") {
      state.balance = null;
    }
  }
  state.filters = freshFilters();
  render();
}
function render() {
  const app =
    document.getElementById("app");
  app.innerHTML = "";
  const sourceTabs = [
    ["geral", "Visão Geral"],
    ["pagar", "Contas a Pagar"],
    ["receber", "Contas a Receber"],
    ["extrato", "Extrato Bancário"]
  ];
  const viewTabs = [
    ["dashboard", "Dashboard"],
    ["detalhamento", "Detalhamento"],
    ["graficos", "Gráficos"]
  ];
  const actionButtons = [];
  if (state.source !== "geral") {
    actionButtons.push(
      node(
        "button",
        {
          class: "btn",
          onclick: () =>
            document
              .getElementById("upload-main")
              ?.click()
        },
        "⟳ Atualizar dados"
      )
    );
  }
  actionButtons.push(
    node(
      "button",
      {
        class: "btn danger",
        onclick: resetCurrentSource
      },
      "🗑 Limpar dados"
    )
  );
  app.append(
    node(
      "div",
      { class: "header" },
      [
        node(
          "div",
          {},
          [
            node(
              "div",
              { class: "eyebrow" },
              "DASHBOARD FINANCEIRO"
            ),
            node(
              "h1",
              { class: "title" },
              "Dane-se · Painel financeiro"
            ),
            node(
              "div",
              { class: "sub" },
              "Dados processados localmente no navegador"
            )
          ]
        ),
        node(
          "div",
          { class: "actions" },
          actionButtons
        )
      ]
    ),
    node(
      "div",
      { class: "tabs" },
      sourceTabs.map(([key, label]) =>
        node(
          "button",
          {
            class:
              `tab${state.source === key
                ? " active"
                : ""}`,
            onclick: () => {
              state.source = key;
              state.filters = freshFilters();
              render();
            }
          },
          label
        )
      )
    ),
    node(
      "div",
      {
        class: "tabs viewtabs"
      },
      viewTabs.map(([key, label]) =>
        node(
          "button",
          {
            class:
              `tab${state.view === key
                ? " active"
                : ""}`,
            onclick: () => {
              state.view = key;
              render();
            }
          },
          label
        )
      )
    )
  );
  if (state.error) {
    app.append(
      node(
        "div",
        { class: "error" },
        `⚠ ${state.error}`
      )
    );
  }
  if (
    state.source !== "geral" &&
    !state.data[state.source]
  ) {
    app.append(
      renderEmptyArea(state.source)
    );
    return;
  }
  if (
    state.source === "geral" &&
    !Object.values(state.data).some(Boolean)
  ) {
    app.append(
      node(
        "div",
        { class: "empty" },
        "Carregue os dados nas abas Contas a Pagar, Contas a Receber ou Extrato Bancário."
      )
    );
    return;
  }
  app.append(
    renderFilters()
  );
  if (state.view === "dashboard") {
    renderDashboard(app);
  } else if (
    state.view === "detalhamento"
  ) {
    renderDetails(app);
  } else {
    renderCharts(app);
  }
  if (state.source !== "geral") {
    app.append(
      node(
        "input",
        {
          id: "upload-main",
          type: "file",
          accept: ".xlsx,.xls,.csv",
          onchange: event =>
            uploadFile(
              state.source,
              event.target.files[0]
            )
        }
      )
    );
  }
  app.append(
    node(
      "div",
      { class: "footer" },
      "Dados processados e armazenados somente neste navegador · sem IA e sem envio para servidores"
    )
  );
}
loadSavedData();
render();
</script>
