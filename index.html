<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Financeiro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#10234a;
  --paper:#fffaf2;
  --dim:#f4ead9;
  --gold:#d89a22;
  --sage:#287a4b;
  --rust:#c5442e;
  --line:#d9c7a6;
  --muted:#514b40;
  --blue:#2457a7;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Inter,sans-serif;
}

.wrap{
  max-width:1220px;
  margin:auto;
  padding:28px 24px 50px;
}

.eyebrow{
  font:11px "IBM Plex Mono";
  color:var(--gold);
  letter-spacing:.08em;
}

.title{
  font:600 28px Fraunces;
  margin:3px 0;
}

.sub{
  font:12px "IBM Plex Mono";
  color:var(--muted);
  margin-top:4px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:#fff;
  padding:9px 14px;
  border-radius:7px;
  cursor:pointer;
  font-weight:600;
}

.btn.secondary{
  background:#fff;
  color:var(--blue);
  border-color:var(--blue);
}

.btn.danger{
  background:#fff;
  color:var(--rust);
  border-color:var(--rust);
}

.tabs{
  display:flex;
  gap:4px;
  border-bottom:1px solid var(--line);
  margin-bottom:20px;
  overflow-x:auto;
}

.tab{
  white-space:nowrap;
  border:0;
  background:none;
  padding:11px 15px;
  margin-bottom:-1px;
  border-bottom:3px solid transparent;
  color:var(--muted);
  cursor:pointer;
  font:12px "IBM Plex Mono";
}

.tab.active{
  color:var(--ink);
  font-weight:600;
  border-bottom-color:var(--gold);
}

.viewtabs{
  margin-top:-8px;
  margin-bottom:22px;
}

.filterbox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  margin-bottom:22px;
  box-shadow:0 5px 16px rgba(16,35,74,.06);
}

.filters{
  display:flex;
  gap:10px;
  align-items:flex-end;
  flex-wrap:wrap;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:145px;
}

.field label{
  font:10px "IBM Plex Mono";
  text-transform:uppercase;
  color:var(--muted);
}

.field input,
.field select{
  height:36px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  color:var(--ink);
  padding:0 9px;
  font:12px Inter;
}

.compareToggle{
  display:flex;
  align-items:center;
  gap:7px;
  height:36px;
  font-size:12px;
}

.compareDates{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  width:100%;
  padding-top:12px;
  border-top:1px solid var(--line);
}

.multi{
  position:relative;
}

.multi summary{
  height:36px;
  display:flex;
  align-items:center;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  cursor:pointer;
  font-size:12px;
  min-width:190px;
}

.multiPanel{
  position:absolute;
  top:58px;
  left:0;
  z-index:30;
  width:300px;
  max-height:300px;
  overflow:auto;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 12px 30px rgba(16,35,74,.22);
  border-radius:8px;
  padding:8px;
}

.multiSearch{
  width:100%;
  padding:8px;
  border:1px solid var(--line);
  border-radius:5px;
  margin-bottom:7px;
  font:12px Inter;
}

.multiActions{
  display:flex;
  gap:6px;
  margin-bottom:6px;
}

.multiActions button{
  flex:1;
  border:1px solid var(--line);
  background:var(--dim);
  border-radius:4px;
  padding:5px;
  cursor:pointer;
  font-size:10px;
}

.multiOpt{
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px;
  font-size:12px;
  border-radius:4px;
  cursor:pointer;
}

.multiOpt:hover{
  background:var(--dim);
}

.kpis{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:14px;
  margin-bottom:28px;
}

.kpi{
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px 14px 5px 14px;
  padding:18px;
  min-width:0;
  box-shadow:0 6px 18px rgba(16,35,74,.10);
}

.kpi.primary{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

.kpi.paid{border-top:5px solid var(--sage)}
.kpi.open{border-top:5px solid var(--gold)}

.kpi.late{
  background:var(--rust);
  color:#fff;
  border-color:var(--rust);
}

.kpi.entity{
  background:var(--gold);
  color:#2a1d08;
  border-color:var(--gold);
}

.kpi.entry{
  background:var(--sage);
  color:#fff;
  border-color:var(--sage);
}

.kpi.exit{
  background:var(--rust);
  color:#fff;
  border-color:var(--rust);
}

.kpi .label{
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  opacity:.78;
}

.kpi .value{
  font:600 23px Fraunces;
  margin:8px 0 5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.kpi .detail{
  font:11px "IBM Plex Mono";
  opacity:.75;
}

.section{
  display:flex;
  align-items:center;
  gap:10px;
  margin:25px 0 13px;
}

.section h2{
  font:600 19px Fraunces;
  margin:0;
}

.rule{
  height:1px;
  background:var(--line);
  flex:1;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:11px;
  padding:17px;
  margin-bottom:22px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(16,35,74,.06);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.chart{
  width:100%;
  overflow-x:auto;
}

.chart svg{
  display:block;
  min-width:680px;
}

.rankScroll{
  max-height:310px;
  overflow-y:auto;
  padding-right:8px;
}

.rankScroll::-webkit-scrollbar,
.tablewrap::-webkit-scrollbar,
.multiPanel::-webkit-scrollbar{
  width:8px;
  height:8px;
}

.rankScroll::-webkit-scrollbar-thumb,
.tablewrap::-webkit-scrollbar-thumb,
.multiPanel::-webkit-scrollbar-thumb{
  background:var(--gold);
  border-radius:8px;
}

.ranking{
  display:flex;
  align-items:center;
  gap:9px;
  margin:10px 0;
}

.rankname{
  width:175px;
  flex-shrink:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
}

.track{
  height:22px;
  background:var(--dim);
  border-radius:4px;
  flex:1;
  overflow:hidden;
}

.fill{
  height:100%;
  border-radius:4px;
}

.rankvalue{
  width:108px;
  flex-shrink:0;
  text-align:right;
  font:11px "IBM Plex Mono";
}

.tablewrap{
  overflow:auto;
  max-height:430px;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}

.table th,
.table td{
  text-align:right;
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.table th:first-child,
.table td:first-child{
  text-align:left;
}

.table th{
  font:10px "IBM Plex Mono";
  text-transform:uppercase;
  color:#fff;
  background:var(--ink);
  position:sticky;
  top:0;
  z-index:2;
}

.table tbody tr:hover{
  background:#fff6e6;
}

.positive{
  color:var(--sage);
  font-weight:600;
}

.negative{
  color:var(--rust);
  font-weight:600;
}

.neutral{color:var(--muted)}

.analysis{
  line-height:1.8;
  font-family:Inter,sans-serif;
  font-size:14px;
  color:#263957;
  border-left:5px solid var(--gold);
  background:linear-gradient(135deg,#fff 0%,#fff8ea 100%);
  padding:22px;
}

.analysisTitle{
  display:block;
  font:700 20px Fraunces;
  color:var(--ink);
  margin-bottom:11px;
}

.analysisLead{
  font-family:Inter,sans-serif;
  font-weight:500;
  font-size:14px;
  line-height:1.8;
  margin-bottom:16px;
}

.analysisLead p{
  margin:0 0 11px;
}

.analysisList{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.insight{
  background:#fff;
  border:1px solid #edcf91;
  border-radius:8px;
  padding:12px;
  box-shadow:0 3px 10px rgba(16,35,74,.06);
}

.insight strong{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  color:var(--ink);
  margin-bottom:5px;
}

.catgroup{margin-bottom:22px}

.cathead{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:2px solid var(--line);
  font:600 16px Fraunces;
}

.catsub{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0 8px 24px;
  color:var(--muted);
  font-size:12px;
}

.catsub:hover{background:#fff6e6}

.cathead span:last-child,
.catsub span:last-child{
  font-family:"IBM Plex Mono";
  white-space:nowrap;
}

.empty{
  text-align:center;
  max-width:680px;
  margin:45px auto;
}

.drop{
  border:2px dashed var(--gold);
  border-radius:12px;
  padding:38px 20px;
  cursor:pointer;
  background:#fff;
}

.drop.over{
  border-color:var(--blue);
  background:var(--dim);
}

.error{
  color:var(--rust);
  font-size:12px;
  margin:10px 0;
}

.footer{
  text-align:center;
  font:10px "IBM Plex Mono";
  color:var(--muted);
  margin-top:28px;
}

input[type=file]{display:none}

@media(max-width:950px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2,.analysisList{grid-template-columns:1fr}
}

@media(max-width:600px){
  .wrap{padding:20px 14px 40px}
  .kpis{grid-template-columns:1fr}
  .actions{width:100%}
  .actions .btn{flex:1}
  .field{flex:1 1 140px}
  .multi{flex:1 1 190px}
  .rankname{width:125px}
}

.analysisTitle{font:650 18px Inter}.insight{border-color:#e2e8f1;background:#fff;border-radius:9px;box-shadow:none}
.drop{border:1.5px dashed #9eb2d0;border-radius:14px;padding:44px 20px;background:linear-gradient(180deg,#fff,#f8faff);box-shadow:inset 0 0 0 5px #fff;transition:.18s;color:#40516c}
.drop:hover,.drop.over{border-color:var(--blue);background:#f1f6ff;transform:translateY(-1px)}
.empty{margin:55px auto}.empty>p:first-child{font-size:15px;color:var(--ink)}
.footer{color:#8b97aa;margin-top:35px}
.rankScroll::-webkit-scrollbar-thumb,.tablewrap::-webkit-scrollbar-thumb,.multiPanel::-webkit-scrollbar-thumb{background:#aebbd0}

const brl=value=>
  new Intl.NumberFormat("pt-BR",{
    style:"currency",
    currency:"BRL",
    maximumFractionDigits:0
  }).format(Number(value)||0);

function el(tag,attributes={},children=[]){
  const item=document.createElement(tag);

  Object.entries(attributes).forEach(([key,value])=>{
    if(key.startsWith("on")){
      item.addEventListener(key.slice(2),value);
    }else if(key==="class"){
      item.className=value;
    }else if(key==="html"){
      item.innerHTML=value;
    }else{
      item.setAttribute(key,value);
    }
  });

  (Array.isArray(children)?children:[children]).forEach(child=>{
    if(child===null||child===undefined||child===false)return;

    item.appendChild(
      typeof child==="string"
        ?document.createTextNode(child)
        :child
    );
  });

  return item;
}

const normalize=value=>
  (value||"").toString().trim().toLowerCase();

function findColumn(headers,names){
  const wanted=names.map(normalize);

  return headers.findIndex(header=>
    wanted.includes(normalize(header))
  );
}

function parseNumber(value){
  if(typeof value==="number")return value;

  let text=(value||"").toString().trim();

  if(
    text.includes(",")&&
    text.lastIndexOf(",")>text.lastIndexOf(".")
  ){
    text=text.replace(/\./g,"").replace(",",".");
  }

  const number=parseFloat(text.replace(/[^\d.-]/g,""));
  return Number.isNaN(number)?0:number;
}

function parseDate(value){
  if(value instanceof Date)return value;

  if(typeof value==="number"&&value>20000){
    const date=new Date(Math.round((value-25569)*86400000));

    return new Date(
      date.getUTCFullYear(),
      date.getUTCMonth(),
      date.getUTCDate()
    );
  }

  const text=(value||"").toString().trim();

  let match=text.match(
    /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/
  );

  if(match){
    const year=match[3].length===2
      ?Number(`20${match[3]}`)
      :Number(match[3]);

    return new Date(
      year,
      Number(match[2])-1,
      Number(match[1])
    );
  }

  match=text.match(/^(\d{4})-(\d{2})-(\d{2})/);

  return match
    ?new Date(
      Number(match[1]),
      Number(match[2])-1,
      Number(match[3])
    )
    :null;
}

function dateToISO(date){
  if(!date)return "";

  return[
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function formatDateBR(value){
  if(!value)return "não informado";

  const parts=value.split("-");

  return parts.length===3
    ?`${parts[2]}/${parts[1]}/${parts[0]}`
    :value;
}

function parseCategory(raw){
  const text=(raw||"").toString().trim();

  const match=text.match(
    /^(\d+(?:\.\d+)+)\s*[-–.]?\s*(.*)$/
  );

  if(match&&match[2]){
    return{
      code:match[1],
      name:match[2].trim()
    };
  }

  return{
    code:"",
    name:
      text.replace(/^[\d.]+\s*/,"").trim()||
      "Sem categoria"
  };
}

async function parseAccounts(file,key){
  const config=CONFIG[key];

  const workbook=XLSX.read(
    await file.arrayBuffer(),
    {type:"array"}
  );

  const sheetName=
    workbook.SheetNames.find(name=>
      config.sheetRegex.test(name)
    )||workbook.SheetNames[0];

  const worksheet=workbook.Sheets[sheetName];

  const rows=XLSX.utils.sheet_to_json(
    worksheet,
    {
      header:1,
      raw:true,
      defval:""
    }
  );

  const headerIndex=rows.findIndex(row=>
    config.entityHeaders.some(name=>
      row.some(cell=>
        normalize(cell)===normalize(name)
      )
    )
  );

  if(headerIndex<0){
    throw new Error(
      `Não reconheci o relatório de ${config.label}. `+
      "Exporte novamente pelo Conta Azul sem alterar os cabeçalhos."
    );
  }

  const headers=rows[headerIndex];

  const columns={
    entity:findColumn(headers,config.entityHeaders),
    date:findColumn(headers,["Data de vencimento"]),
    status:findColumn(headers,["Situação"]),

    original:findColumn(
      headers,
      ["Valor original da parcela (R$)"]
    ),

    done:findColumn(
      headers,
      config.doneHeaders
    ),

    open:findColumn(
      headers,
      ["Valor total da parcela em aberto (R$)"]
    ),

    costCenter:findColumn(
      headers,
      ["Centro de Custo 1"]
    )
  };

  if(
    columns.entity<0||
    columns.date<0||
    columns.original<0
  ){
    throw new Error(
      "Faltam colunas obrigatórias no arquivo."
    );
  }

  const categoryColumns=[];

  for(let index=1;index<=12;index++){
    const categoryIndex=findColumn(
      headers,
      [`Categoria ${index}`]
    );

    if(categoryIndex>=0){
      categoryColumns.push({
        categoryIndex,

        valueIndex:findColumn(
          headers,
          [`Valor na Categoria ${index}`]
        )
      });
    }
  }

  const records=[];

  rows.slice(headerIndex+1).forEach(row=>{
    const date=parseDate(row[columns.date]);

    if(!date)return;

    const original=Math.abs(
      parseNumber(row[columns.original])
    );

    const allocations=[];

    categoryColumns.forEach(column=>{
      const raw=row[column.categoryIndex];

      if(!String(raw||"").trim())return;

      const category=parseCategory(raw);

      allocations.push({
        code:category.code,
        name:category.name,

        value:Math.abs(
          parseNumber(row[column.valueIndex])
        )
      });
    });

    if(!allocations.length){
      allocations.push({
        code:"",
        name:"Sem categoria",
        value:original
      });
    }else if(
      !allocations.some(allocation=>allocation.value)
    ){
      allocations[0].value=original;
    }

    const formattedDate=dateToISO(date);

    records.push({
      entity:String(
        row[columns.entity]||
        `Sem ${config.entityLabel.toLowerCase()}`
      ).trim(),

      status:String(
        row[columns.status]||
        "Não informado"
      ).trim(),

      original,

      done:Math.abs(
        parseNumber(row[columns.done])
      ),

      open:Math.abs(
        parseNumber(row[columns.open])
      ),

      costCenter:
        columns.costCenter>=0
          ?String(
            row[columns.costCenter]||
            "Sem centro de custo"
          ).trim()
          :"Sem centro de custo",

      allocations,
      date:formattedDate,
      month:formattedDate.slice(0,7)
    });
  });

  if(!records.length){
    throw new Error(
      "Nenhum lançamento válido foi encontrado."
    );
  }

  return records;
}

async function parseStatement(file){
  const workbook=XLSX.read(
    await file.arrayBuffer(),
    {type:"array"}
  );

  const sheetName=
    workbook.SheetNames.find(name=>
      /extrato/i.test(name)
    )||workbook.SheetNames[0];

  const worksheet=workbook.Sheets[sheetName];

  const rows=XLSX.utils.sheet_to_json(
    worksheet,
    {
      header:1,
      raw:true,
      defval:""
    }
  );

  const dateHeaders=[
    "Data",
    "Data do Lançamento",
    "Data Lançamento",
    "Data lançamento"
  ];

  const valueHeaders=[
    "Valor",
    "Valor (R$)",
    "Valor R$",
    "Valor da Transação",
    "Valor da transacao"
  ];

  const headerIndex=rows.findIndex(row=>
    findColumn(row,dateHeaders)>=0&&
    findColumn(row,valueHeaders)>=0
  );

  if(headerIndex<0){
    throw new Error(
      "Não reconheci o extrato. Preciso das colunas Data e Valor."
    );
  }

  const headers=rows[headerIndex];

  const columns={
    date:findColumn(headers,dateHeaders),
    value:findColumn(headers,valueHeaders),

    description:findColumn(
      headers,
      [
        "Descrição",
        "Histórico",
        "Descricao",
        "Historico",
        "Complemento",
        "Detalhes"
      ]
    ),

    type:findColumn(
      headers,
      [
        "Tipo",
        "Natureza",
        "D/C",
        "Tipo Lançamento"
      ]
    ),

    balance:findColumn(
      headers,
      [
        "Saldo",
        "Saldo (R$)",
        "Saldo Final",
        "Saldo final"
      ]
    )
  };

  let balance=null;
  const records=[];

  rows.slice(headerIndex+1).forEach(row=>{
    const date=parseDate(row[columns.date]);

    if(!date)return;

    const rawValue=parseNumber(
      row[columns.value]
    );

    const rawType=normalize(
      row[columns.type]
    );

    let type;

    if(rawType.startsWith("d")){
      type="exit";
    }else if(rawType.startsWith("c")){
      type="entry";
    }else{
      type=rawValue<0
        ?"exit"
        :"entry";
    }

    if(
      columns.balance>=0&&
      row[columns.balance]!==""
    ){
      balance=parseNumber(
        row[columns.balance]
      );
    }

    const formattedDate=dateToISO(date);

    records.push({
      date:formattedDate,
      month:formattedDate.slice(0,7),
      value:Math.abs(rawValue),
      type,

      description:String(
        row[columns.description]||
        "Sem descrição"
      ).trim()
    });
  });

  if(!records.length){
    throw new Error(
      "Nenhum lançamento válido foi encontrado no extrato."
    );
  }

  return{
    records,
    balance
  };
}

function loadData(){
  ["pagar","receber","extrato"].forEach(key=>{
    try{
      const saved=JSON.parse(
        localStorage.getItem(
          `dane-se-dashboard-${key}-v10`
        )
      );

      if(!saved)return;

      state.data[key]=saved.records;
      state.updated[key]=saved.updated;

      if(key==="extrato"){
        state.balance=saved.balance;
      }
    }catch(error){
      console.error(error);
    }
  });
}

function saveData(key){
  localStorage.setItem(
    `dane-se-dashboard-${key}-v10`,
    JSON.stringify({
      records:state.data[key],
      updated:state.updated[key],
      balance:state.balance
    })
  );
}

function cloudPayload(){
  return{

  };
}

function applyCloudPayload(payload){
  if(!payload)return;
  state.data={pagar:null,receber:null,extrato:null,...(payload.data||{})};
  state.updated=payload.updated||{};
  state.balance=payload.balance??null;
  Object.keys(state.data).forEach(key=>{
    if(state.data[key])saveData(key);
  });
}

function baseFilter(records){
  const filters=state.filters;

  return(records||[])
    .filter(record=>
      !filters.status||
      record.status===filters.status
    )
    .filter(record=>
      !filters.entity||
      record.entity===filters.entity
    )
    .filter(record=>
      !filters.costCenter||
      record.costCenter===filters.costCenter
    )
    .filter(record=>{
      if(!filters.groups.length&&!filters.categories.length)return true;

      return record.allocations?.some(allocation=>
        (!filters.groups.length||filters.groups.includes(allocationGroup(allocation)))&&
        (!filters.categories.length||filters.categories.includes(allocation.name))
      );
    })
    .filter(record=>
      !filters.type||
      record.type===filters.type
    );
}

function periodFilter(records,period=0){
  const filters=state.filters;

  let from="";
  let to="";
  let month="";

  if(filters.compare){
    if(period===1){
      from=filters.period1From;
      to=filters.period1To;
    }else{
      from=filters.period2From;
      to=filters.period2To;
    }
  }else{
    from=filters.dateFrom;
    to=filters.dateTo;

    month=
      period===1
        ?filters.month1
        :period===2
          ?filters.month2
          :"";

    if(from||to)month="";
  }

  return baseFilter(records)
    .filter(record=>
      !from||record.date>=from
    )
    .filter(record=>
      !to||record.date<=to
    )
    .filter(record=>
      !month||record.month===month
    );
}

function selectedRecords(records){
  return periodFilter(
    records,
    state.filters.compare||
    state.filters.month2
      ?2
      :1
  );
}

function displayRecords(records){
  const filters=state.filters;

  if(filters.compare||filters.month2){
    return[
      ...new Set([
        ...periodFilter(records,1),
        ...periodFilter(records,2)
      ])
    ];
  }

  return periodFilter(records,1);
}

function variation(firstValue,secondValue){
  if(firstValue===0){
    return secondValue===0?0:NaN;
  }

  return(
    (secondValue-firstValue)/
    Math.abs(firstValue)
  )*100;
}

function periodLabels(){
  const filters=state.filters;
  const months=availableMonths();

  const monthLabel=key=>
    months.find(month=>month.key===key)?.label||
    "Período não selecionado";

  const range=(from,to)=>
    `${from?formatDateBR(from):"início"} a `+
    `${to?formatDateBR(to):"fim"}`;

  if(filters.compare){
    return[
      range(
        filters.period1From,
        filters.period1To
      ),

      range(
        filters.period2From,
        filters.period2To
      )
    ];
  }

  return[
    filters.dateFrom||filters.dateTo
      ?range(
        filters.dateFrom,
        filters.dateTo
      )
      :monthLabel(filters.month1),

    monthLabel(filters.month2)
  ];
}

function monthLabelFromRange(from,to,fallback){
  if(from&&to&&from.slice(0,7)===to.slice(0,7)){
    const key=from.slice(0,7);
    return `${MONTHS[Number(key.slice(5))-1]}/${key.slice(0,4)}`;
  }

  return fallback;
}

function comparisonLabels(){
  const filters=state.filters;
  const labels=periodLabels();

  if(filters.compare){
    return[
      monthLabelFromRange(filters.period1From,filters.period1To,"Período 1"),
      monthLabelFromRange(filters.period2From,filters.period2To,"Período 2")
    ];
  }

  return labels;
}

  const count=target[filterKey].length;

    el("label",{},label),

      "summary",

        :`Todas as ${label.toLowerCase()}`
    )
  );

  const panel=el(
    "div",
    {class:"multiPanel"}
  );

    optionsContainer.innerHTML="";

      item=>
        item
          .toLowerCase()
          .includes(search.toLowerCase())
    );

    if(!filtered.length){
      optionsContainer.append(
        el(
          "div",
          {
            style:
              "padding:10px;font-size:12px;color:#514b40"
          },
          `Nenhuma ${label.toLowerCase()} encontrada.`

      );

      return;
    }

    filtered.forEach(item=>{

      );

      checkbox.onchange=()=>{

          target[filterKey]=[
            ...new Set([
              ...target[filterKey],
              item
            ])

              value=>value!==item
            );
        }

        render();
      };

      optionsContainer.append(
        el(
          "label",
          {class:"multiOpt"},
          [
            checkbox,
            item
          ]
        )
      );
    });
  }

  panel.append(
    el(
      "input",
      {
        class:"multiSearch",
        type:"search",
        placeholder,

        oninput:event=>
          drawOptions(
            event.target.value
          )
      }
    ),

function accountTotals(records){
  return{
    total:records.reduce(
      (sum,record)=>
        sum+record.original,
      0
    ),

    done:records.reduce(
      (sum,record)=>
        sum+record.done,
      0
    ),

    open:records
      .filter(record=>
        record.status==="Em aberto"
      )
      .reduce(
        (sum,record)=>
          sum+record.open,
        0
      ),

    late:records
      .filter(record=>
        record.status==="Atrasado"
      )
      .reduce(
        (sum,record)=>
          sum+record.open,
        0
      ),

    entityCount:new Set(
      records.map(record=>record.entity)
    ).size
  };
}

function filteredAllocations(record){
  if(!record.allocations)return[];

  if(!state.filters.groups.length&&!state.filters.categories.length){
    return record.allocations;
  }

  return record.allocations.filter(
    allocation=>
      (!state.filters.groups.length||state.filters.groups.includes(allocationGroup(allocation)))&&
      (!state.filters.categories.length||state.filters.categories.includes(allocation.name))
  );
}

function allocationGroup(allocation){
  const parts=(allocation.code||"").split(".");
  const key=parts.length>=2?parts.slice(0,2).join("."):allocation.name;
  return GROUP_LABELS[key]||allocation.name;
}

function categoryMap(records){
  const map=new Map();

  records.forEach(record=>{
    filteredAllocations(record).forEach(
      allocation=>{
        map.set(
          allocation.name,

          (
            map.get(allocation.name)||
            0
          )+allocation.value
        );
      }
    );
  });

  return map;
}

function categoryGroups(records){
  const groups=new Map();

  records.forEach(record=>{
    filteredAllocations(record).forEach(
      allocation=>{
        const parts=
          (allocation.code||"")
            .split(".");

        const key=
          parts.length>=2
            ?parts.slice(0,2).join(".")
            :allocation.name;

        const label=
          GROUP_LABELS[key]||
          allocation.name;

        if(!groups.has(key)){
          groups.set(
            key,
            {
              label,
              total:0,
              subcategories:new Map()
            }
          );
        }

        const group=groups.get(key);

        group.total+=
          allocation.value;

        group.subcategories.set(
          allocation.name,

          (
            group.subcategories.get(
              allocation.name
            )||0
          )+allocation.value
        );
      }
    );
  });

  return[
    ...groups.values()
  ].sort(
    (first,second)=>
      second.total-first.total
  );
}

function rankingData(records,property){

}

function barChart(data,color){
  const width=1000;
  const height=280;
  const left=65;
  const bottom=35;

  const maximum=Math.max(
    1,
    ...data.map(item=>item.value)
  );

  const gap=
    (width-left-20)/
    Math.max(data.length,1);

  const barWidth=
    Math.min(70,gap*.62);

  const svg=document.createElementNS(
    "http://www.w3.org/2000/svg",
    "svg"
  );

  svg.setAttribute(
    "viewBox",
    `0 0 ${width} ${height}`
  );

  data.forEach((item,index)=>{
    const barHeight=
      (height-bottom-20)*
      (item.value/maximum);

    const x=
      left+
      index*gap+
      (gap-barWidth)/2;

    const y=
      height-
      bottom-
      barHeight;

    const rectangle=
      document.createElementNS(
        svg.namespaceURI,
        "rect"
      );

    rectangle.setAttribute("x",x);
    rectangle.setAttribute("y",y);
    rectangle.setAttribute(
      "width",
      barWidth
    );
    rectangle.setAttribute(
      "height",
      barHeight
    );
    rectangle.setAttribute("rx",4);
    rectangle.setAttribute(
      "fill",
      color
    );

    const tooltip=
      document.createElementNS(
        svg.namespaceURI,
        "title"
      );

    tooltip.textContent=
      `${item.label}: ${brl(item.value)}`;

    rectangle.append(tooltip);
    svg.append(rectangle);

    const label=
      document.createElementNS(
        svg.namespaceURI,
        "text"
      );

    label.setAttribute(
      "x",
      x+barWidth/2
    );

    label.setAttribute(
      "y",
      height-10
    );

    label.setAttribute(
      "text-anchor",
      "middle"
    );

    label.setAttribute(
      "font-size",
      "10"
    );

    label.textContent=item.label;
    svg.append(label);
  });

  return el(
    "div",
    {class:"chart"},
    svg
  );
}

function receivableComparisonInformation(){
  const firstRecords=periodFilter(state.data.receber,1);
  const secondRecords=periodFilter(state.data.receber,2);
  const totalOf=records=>records.reduce((sum,record)=>sum+record.original,0);
  const firstTotal=totalOf(firstRecords);
  const secondTotal=totalOf(secondRecords);
  const firstCategories=categoryMap(firstRecords);
  const secondCategories=categoryMap(secondRecords);
  const changes=[...new Set([...firstCategories.keys(),...secondCategories.keys()])].map(name=>{
    const firstValue=firstCategories.get(name)||0;
    const secondValue=secondCategories.get(name)||0;
    return{name,firstValue,secondValue,difference:secondValue-firstValue,percentage:variation(firstValue,secondValue)};
  }).sort((a,b)=>Math.abs(b.difference)-Math.abs(a.difference));
  const biggestIncrease=[...changes].filter(item=>item.difference>0).sort((a,b)=>b.difference-a.difference)[0];
  const biggestReduction=[...changes].filter(item=>item.difference<0).sort((a,b)=>a.difference-b.difference)[0];
  const biggestImpact=changes[0];
  const newExpenses=changes.filter(item=>item.firstValue===0&&item.secondValue>0);
  const removedExpenses=changes.filter(item=>item.firstValue>0&&item.secondValue===0);
  const totalDifference=secondTotal-firstTotal;
  const totalPercentage=variation(firstTotal,secondTotal);
  const firstTotals=accountTotals(firstRecords);
  const secondTotals=accountTotals(secondRecords);
  const labels=periodLabels();
  const secondRanking=[...secondCategories.entries()].sort((a,b)=>b[1]-a[1]);
  const concentration=secondTotal?secondRanking.slice(0,3).reduce((sum,[,value])=>sum+value,0)/secondTotal*100:0;
  const paragraphs=[];

  paragraphs.push(
    `Na comparação entre ${labels[0]} e ${labels[1]}, o valor previsto a receber ${totalDifference>=0?"aumentou":"diminuiu"} ${brl(Math.abs(totalDifference))}`+
    `${Number.isFinite(totalPercentage)?`, uma variação de ${Math.abs(totalPercentage).toFixed(1).replace(".",",")}% ${totalDifference>=0?"positiva":"negativa"} em relação ao primeiro período.`:"."}`
  );
  paragraphs.push(
    `No primeiro período, havia ${firstRecords.length} ${firstRecords.length===1?"lançamento":"lançamentos"}, com ${brl(firstTotals.done)} recebido, ${brl(firstTotals.open)} a receber e ${brl(firstTotals.late)} atrasado. `+
    `No segundo período, são ${secondRecords.length} ${secondRecords.length===1?"lançamento":"lançamentos"}, com ${brl(secondTotals.done)} recebido, ${brl(secondTotals.open)} a receber e ${brl(secondTotals.late)} atrasado.`
  );
  const receivedVariation=variation(firstTotals.done,secondTotals.done);
  paragraphs.push(
    `O valor efetivamente recebido ${secondTotals.done>=firstTotals.done?"cresceu":"recuou"} ${brl(Math.abs(secondTotals.done-firstTotals.done))}`+
    `${Number.isFinite(receivedVariation)?` (${Math.abs(receivedVariation).toFixed(1).replace(".",",")}% ${secondTotals.done>=firstTotals.done?"de aumento":"de redução"}).`:"."} `+
    `${secondTotals.late>firstTotals.late?`O saldo atrasado aumentou ${brl(secondTotals.late-firstTotals.late)}, o que exige reforço nas cobranças e acompanhamento dos clientes inadimplentes.`:secondTotals.late<firstTotals.late?`O saldo atrasado diminuiu ${brl(firstTotals.late-secondTotals.late)}, indicando melhora na recuperação dos recebíveis.`:"O saldo atrasado permaneceu estável entre os períodos."}`
  );
  if(secondRanking.length)paragraphs.push(
    `As principais categorias de recebimento no segundo período foram ${secondRanking.slice(0,3).map(([name,value])=>`${name} (${brl(value)})`).join(", ")}. Juntas, representam ${concentration.toFixed(1).replace(".",",")}% do valor previsto a receber, ${concentration>=60?"demonstrando concentração relevante das receitas":"indicando uma composição mais distribuída das receitas"}.`
  );
  if(biggestIncrease)paragraphs.push(`O maior crescimento ocorreu em ${biggestIncrease.name}, com aumento de ${brl(biggestIncrease.difference)} em relação ao primeiro período.`);
  if(biggestReduction)paragraphs.push(`A maior redução ocorreu em ${biggestReduction.name}, com queda de ${brl(Math.abs(biggestReduction.difference))}. É importante verificar se essa redução decorre de sazonalidade, menor volume de vendas ou alteração nas datas de vencimento.`);
  paragraphs.push(totalDifference>=0
    ?"A evolução do valor a receber é positiva, mas deve ser analisada em conjunto com o montante efetivamente recebido e com os atrasos, pois crescimento de contas a receber sem conversão em caixa pode aumentar a necessidade de capital de giro."
    :"A redução do valor a receber merece acompanhamento comercial e financeiro para identificar se houve queda nas vendas, antecipação de recebimentos ou mudança no calendário de faturamento.");

  return{firstRecords,secondRecords,firstTotal,secondTotal,totalDifference,totalPercentage,changes,biggestIncrease,biggestReduction,biggestImpact,newExpenses,removedExpenses,paragraphs,text:paragraphs.join(" ")};
}

function comparisonInformation(){
  if(state.source==="receber")return receivableComparisonInformation();
  const sourceKey=state.source==="receber"?"receber":"pagar";
  const firstRecords=
    periodFilter(
      state.data[sourceKey],
      1
    );

  const secondRecords=
    periodFilter(
      state.data[sourceKey],
      2
    );

  const firstTotal=
    firstRecords.reduce(
      (sum,record)=>
        sum+record.original,
      0
    );

  const secondTotal=
    secondRecords.reduce(
      (sum,record)=>
        sum+record.original,
      0
    );

  /*
    categoryMap soma apenas as subcategorias
    selecionadas nos filtros.
  */
  const firstSubcategories=
    categoryMap(firstRecords);

  const secondSubcategories=
    categoryMap(secondRecords);

  const changes=[
    ...new Set([
      ...firstSubcategories.keys(),
      ...secondSubcategories.keys()
    ])
  ]
    .map(name=>{
      const firstValue=
        firstSubcategories.get(name)||
        0;

      const secondValue=
        secondSubcategories.get(name)||
        0;

      return{
        name,
        firstValue,
        secondValue,

        difference:
          secondValue-firstValue,

        percentage:
          variation(
            firstValue,
            secondValue
          )
      };
    })
    .sort(
      (first,second)=>
        Math.abs(second.difference)-
        Math.abs(first.difference)
    );

  const biggestIncrease=[
    ...changes
  ]
    .filter(item=>
      item.difference>0
    )
    .sort(
      (first,second)=>
        second.difference-
        first.difference
    )[0];

  const biggestReduction=[
    ...changes
  ]
    .filter(item=>
      item.difference<0
    )
    .sort(
      (first,second)=>
        first.difference-
        second.difference
    )[0];

  const biggestImpact=changes[0];

  const newExpenses=changes.filter(
    item=>
      item.firstValue===0&&
      item.secondValue>0
  );

  const removedExpenses=changes.filter(
    item=>
      item.firstValue>0&&
      item.secondValue===0
  );

  const totalDifference=
    secondTotal-firstTotal;

  const totalPercentage=
    variation(
      firstTotal,
      secondTotal
    );

  const increased=changes.filter(item=>item.difference>0);
  const reduced=changes.filter(item=>item.difference<0);
  const unchanged=changes.filter(item=>item.difference===0);
  const firstAverage=firstRecords.length?firstTotal/firstRecords.length:0;
  const secondAverage=secondRecords.length?secondTotal/secondRecords.length:0;
  const secondRanking=[...secondSubcategories.entries()].sort((a,b)=>b[1]-a[1]);
  const topThreeTotal=secondRanking.slice(0,3).reduce((sum,[,value])=>sum+value,0);
  const concentration=secondTotal?topThreeTotal/secondTotal*100:0;

  const labels=periodLabels();
  const paragraphs=[];

  if(totalDifference===0){
    paragraphs.push(
      `Na comparação entre ${labels[0]} e ${labels[1]}, `+
      "o total das despesas permaneceu estável, sem diferença financeira entre os períodos."
    );
  }else{
    paragraphs.push(
      `Na comparação entre ${labels[0]} e ${labels[1]}, `+
      `as despesas ${totalDifference<0
        ?"diminuíram"
        :"aumentaram"} `+
      `${brl(Math.abs(totalDifference))}`+
      (
        Number.isFinite(totalPercentage)
          ?`, o equivalente a `+
          `${Math.abs(totalPercentage)
            .toFixed(1)
            .replace(".",",")}% de `+
          `${totalDifference<0
            ?"redução"
            :"aumento"} em relação ao primeiro período.`
          :"."
      )
    );
  }

  paragraphs.push(
    `O primeiro período reúne ${firstRecords.length} ${firstRecords.length===1?"lançamento":"lançamentos"}, com valor médio de ${brl(firstAverage)} por lançamento. `+
    `No segundo período foram ${secondRecords.length} ${secondRecords.length===1?"lançamento":"lançamentos"}, com média de ${brl(secondAverage)}.`
  );

  paragraphs.push(
    `Das ${changes.length} ${changes.length===1?"subcategoria analisada":"subcategorias analisadas"}, `+
    `${increased.length} ${increased.length===1?"apresentou aumento":"apresentaram aumento"}, `+
    `${reduced.length} ${reduced.length===1?"teve redução":"tiveram redução"} e `+
    `${unchanged.length} ${unchanged.length===1?"permaneceu estável":"permaneceram estáveis"}.`
  );

  if(secondRanking.length){
    paragraphs.push(
      `No segundo período, as três maiores subcategorias foram ${secondRanking.slice(0,3).map(([name,value])=>`${name} (${brl(value)})`).join(", ")}. `+
      `Juntas, elas representam ${concentration.toFixed(1).replace(".",",")}% das despesas do período, indicando ${concentration>=60?"concentração elevada dos gastos":"distribuição mais equilibrada dos gastos"}.`
    );
  }

  if(biggestIncrease){
    paragraphs.push(
      `Entre as subcategorias filtradas, o maior aumento ocorreu em `+
      `${biggestIncrease.name}, que passou de `+
      `${brl(biggestIncrease.firstValue)} para `+
      `${brl(biggestIncrease.secondValue)}, `+
      `um acréscimo de ${brl(biggestIncrease.difference)}`+
      (
        Number.isFinite(
          biggestIncrease.percentage
        )
          ?` (${Math.abs(
            biggestIncrease.percentage
          ).toFixed(1).replace(".",",")}%).`
          :"."
      )
    );
  }else{
    paragraphs.push(
      "Nenhuma subcategoria apresentou aumento no período comparado."
    );
  }

  if(biggestReduction){
    paragraphs.push(
      `A maior redução ocorreu em `+
      `${biggestReduction.name}, cujo valor passou de `+
      `${brl(biggestReduction.firstValue)} para `+
      `${brl(biggestReduction.secondValue)}, `+
      `uma queda de ${brl(
        Math.abs(
          biggestReduction.difference
        )
      )}`+
      (
        Number.isFinite(
          biggestReduction.percentage
        )
          ?` (${Math.abs(
            biggestReduction.percentage
          ).toFixed(1).replace(".",",")}% de redução).`
          :"."
      )
    );
  }else{
    paragraphs.push(
      "Nenhuma subcategoria apresentou redução no período comparado."
    );
  }

  if(biggestImpact){
    paragraphs.push(
      `${biggestImpact.name} foi a subcategoria com maior impacto `+
      "na variação total observada."
    );
  }

  if(newExpenses.length){
    paragraphs.push(
      `${newExpenses.length} `+
      `${newExpenses.length===1
        ?"subcategoria apareceu"
        :"subcategorias apareceram"} `+
      "somente no segundo período."
    );
  }

  if(removedExpenses.length){
    paragraphs.push(
      `${removedExpenses.length} `+
      `${removedExpenses.length===1
        ?"subcategoria deixou"
        :"subcategorias deixaram"} `+
      "de apresentar movimentação no segundo período."
    );
  }

  if(totalDifference>0){
    paragraphs.push(
      "Ponto de atenção: recomenda-se revisar os aumentos identificados e confirmar se são recorrentes, extraordinários ou decorrentes de alteração nos vencimentos."
    );
  }else if(totalDifference<0){
    paragraphs.push(
      "É importante confirmar se a redução representa uma economia recorrente ou apenas uma alteração nas datas de vencimento e pagamento."
    );
  }else{
    paragraphs.push(
      "Apesar da estabilidade do total, a composição interna das despesas pode ter mudado."
    );
  }

  return{
    firstRecords,
    secondRecords,
    firstTotal,
    secondTotal,
    totalDifference,
    totalPercentage,
    changes,
    biggestIncrease,
    biggestReduction,
    biggestImpact,
    newExpenses,
    removedExpenses,
    paragraphs,
    text:paragraphs.join(" ")
  };
}

function renderAnalysis(){
  const enabled=
    state.filters.compare||
    (
      state.filters.month1&&
      state.filters.month2
    );

  if(!enabled){
    if(state.source==="receber"){
      const records=displayRecords(state.data.receber);
      const analysis=dashboardReportAnalysis(records,"receber");
      const years=[...new Set(records.map(record=>record.month?.slice(0,4)).filter(Boolean))].join(", ");
      return el("div",{class:"card analysis"},[
        el("span",{class:"analysisTitle"},state.filters.dateFrom||state.filters.dateTo||state.filters.month1?"Análise dos recebimentos filtrados":`Análise anual de recebimentos${years?` · ${years}`:""}`),
        el("div",{class:"analysisLead"},analysis.paragraphs.map(paragraph=>el("p",{},paragraph)))
      ]);
    }
    const records=displayRecords(state.data.pagar);
    const total=records.reduce((sum,record)=>sum+record.original,0);
    const months=new Map();
    records.forEach(record=>months.set(record.month,(months.get(record.month)||0)+record.original));
    const ordered=[...months.entries()].sort(([a],[b])=>a.localeCompare(b));
    const categories=[...categoryMap(records).entries()].sort((a,b)=>b[1]-a[1]);
    const totals=accountTotals(records);
    const monthlyAverage=ordered.length?total/ordered.length:0;
    const highest=[...ordered].sort((a,b)=>b[1]-a[1])[0];
    const lowest=[...ordered].sort((a,b)=>a[1]-b[1])[0];
    const topThree=categories.slice(0,3).reduce((sum,[,value])=>sum+value,0);
    const concentration=total?topThree/total*100:0;
    const suppliers=[...records.reduce((map,record)=>map.set(record.entity,(map.get(record.entity)||0)+record.original),new Map()).entries()].sort((a,b)=>b[1]-a[1]);
    const supplierTopFive=suppliers.slice(0,5).reduce((sum,[,value])=>sum+value,0);
    const supplierConcentration=total?supplierTopFive/total*100:0;
    const overdueRate=total?totals.late/total*100:0;
    const openRate=total?totals.open/total*100:0;
    const first=ordered[0];
    const last=ordered.at(-1);
    const change=first&&last?variation(first[1],last[1]):0;
    const years=[...new Set(records.map(record=>record.month?.slice(0,4)).filter(Boolean))].join(", ");
    const title=state.filters.dateFrom||state.filters.dateTo||state.filters.month1
      ?"Análise do período filtrado"
      :`Análise anual${years?` · ${years}`:""}`;
    const paragraphs=[
      `Foram analisados ${records.length} ${records.length===1?"lançamento":"lançamentos"}, totalizando ${brl(total)} em despesas. A média mensal foi de ${brl(monthlyAverage)} considerando ${ordered.length} ${ordered.length===1?"mês com movimentação":"meses com movimentação"}.`,
      `Do total analisado, ${brl(totals.done)} já foi pago, ${brl(totals.open)} permanece em aberto e ${brl(totals.late)} está atrasado. ${totals.late>0?"Os valores atrasados merecem acompanhamento prioritário para evitar juros, multas e pressão no fluxo de caixa.":"Não foram identificados valores atrasados nos filtros atuais."}`,
      categories[0]
        ?`As subcategorias de maior impacto foram ${categories.slice(0,3).map(([name,value])=>`${name} (${brl(value)})`).join(", ")}. Juntas, representam ${concentration.toFixed(1).replace(".",",")}% das despesas, o que ${concentration>=60?"demonstra concentração relevante e recomenda uma revisão detalhada desses gastos":"indica uma distribuição relativamente equilibrada entre as despesas"}.`
        :"Não há subcategorias com movimentação para os filtros atuais.",
      highest&&lowest
        ?`${MONTHS[Number(highest[0].slice(5))-1]}/${highest[0].slice(0,4)} apresentou o maior volume de despesas, com ${brl(highest[1])}. O menor volume ocorreu em ${MONTHS[Number(lowest[0].slice(5))-1]}/${lowest[0].slice(0,4)}, com ${brl(lowest[1])}. A diferença entre esses meses foi de ${brl(highest[1]-lowest[1])}.`
        :"Não há meses suficientes para identificar o maior e o menor volume de despesas.",
      first&&last&&first[0]!==last[0]
        ?`Entre ${MONTHS[Number(first[0].slice(5))-1]}/${first[0].slice(0,4)} e ${MONTHS[Number(last[0].slice(5))-1]}/${last[0].slice(0,4)}, as despesas ${last[1]>=first[1]?"aumentaram":"diminuíram"} ${brl(Math.abs(last[1]-first[1]))}${Number.isFinite(change)?` (${Math.abs(change).toFixed(1).replace(".",",")}%)`:""}.`
        :"O período disponível não permite comparar meses diferentes.",
      `A exposição financeira em aberto corresponde a ${openRate.toFixed(1).replace(".",",")}% do total analisado. O índice de atraso é de ${overdueRate.toFixed(1).replace(".",",")}%. ${overdueRate>=10?"Esse nível é crítico e recomenda um plano imediato de regularização e priorização por impacto financeiro.":overdueRate>0?"Embora controlável, o atraso deve ser acompanhado semanalmente para impedir juros e perda de previsibilidade.":"A ausência de atrasos indica boa disciplina de pagamentos no recorte atual."}`,
      suppliers[0]
        ?`Os cinco maiores fornecedores concentram ${supplierConcentration.toFixed(1).replace(".",",")}% das despesas. O maior é ${suppliers[0][0]}, com ${brl(suppliers[0][1])}. ${supplierConcentration>=60?"A concentração é elevada; recomenda-se avaliar dependência, condições comerciais, prazos e alternativas de fornecimento.":"A concentração encontra-se distribuída, reduzindo o risco de dependência excessiva de poucos fornecedores."}`
        :"Não há fornecedores suficientes para avaliar concentração.",
      `Recomendação executiva: priorizar a liquidação dos valores vencidos, revisar as três categorias de maior impacto, validar despesas extraordinárias e negociar prazos com fornecedores relevantes. Para o próximo ciclo, use a média mensal de ${brl(monthlyAverage)} como referência inicial, ajustando sazonalidades e compromissos já contratados.`
    ];

    return el("div",{class:"card analysis"},[
      el("span",{class:"analysisTitle"},title),
      el("div",{class:"analysisLead"},paragraphs.map(paragraph=>el("p",{},paragraph)))
    ]);
  }

  const information=
    comparisonInformation();

  return el(
    "div",
    {class:"card analysis"},
    [
      el(
        "span",
        {class:"analysisTitle"},
        "Resumo da comparação"
      ),

      el(
        "div",
        {class:"analysisLead"},

        information.paragraphs.map(
          paragraph=>
            el("p",{},paragraph)
        )
      ),

      el(
        "div",
        {class:"analysisList"},
        [
          el(
            "div",
            {class:"insight"},
            [
              el(
                "strong",
                {},
                "Variação total"
              ),

              Number.isFinite(
                information.totalPercentage
              )
                ?`${information.totalPercentage>0
                  ?"+"
                  :""}`+
                  `${information.totalPercentage
                    .toFixed(1)
                    .replace(".",",")}%`
                :"Sem base comparável"
            ]
          ),

          el(
            "div",
            {class:"insight"},
            [
              el(
                "strong",
                {},
                "Maior aumento"
              ),

              information.biggestIncrease
                ?`${information.biggestIncrease.name}: `+
                brl(
                  information.biggestIncrease.difference
                )
                :"Nenhum aumento"
            ]
          ),

          el(
            "div",
            {class:"insight"},
            [
              el(
                "strong",
                {},
                "Maior redução"
              ),

              information.biggestReduction
                ?`${information.biggestReduction.name}: `+
                brl(
                  Math.abs(
                    information.biggestReduction.difference
                  )
                )
                :"Nenhuma redução"
            ]
          )
        ]
      )
    ]
  );
}

  const groups=[...new Set(records.flatMap(record=>(record.allocations||[]).map(allocation=>allocationGroup(allocation))))].sort((a,b)=>a.localeCompare(b,"pt-BR"));

  ]);

function renderCategories(app){
  if(state.source==="extrato"){
    app.append(sectionHeader("CATEGORIAS","Detalhamento por categoria"),el("div",{class:"card"},"O extrato bancário não possui categorias ou subcategorias no arquivo importado."));
    return;
  }

  const key=
    state.source==="receber"
      ?"receber"
      :"pagar";

  const filters=state.categoryFilters;
  const source=state.data[key]||[];
  const allocationsFor=record=>(record.allocations||[]).filter(allocation=>
    (!filters.groups.length||filters.groups.includes(allocationGroup(allocation)))&&
    (!filters.categories.length||filters.categories.includes(allocation.name))
  );
  const recordsForMonth=month=>source.filter(record=>!month||record.month===month);
  const mapFor=records=>{
    const map=new Map();
    records.forEach(record=>allocationsFor(record).forEach(allocation=>map.set(allocation.name,(map.get(allocation.name)||0)+allocation.value)));
    return map;
  };
  const groupsFor=records=>{
    const map=new Map();
    records.forEach(record=>allocationsFor(record).forEach(allocation=>{
      const label=allocationGroup(allocation);
      if(!map.has(label))map.set(label,{label,total:0,subcategories:new Map()});
      const group=map.get(label);
      group.total+=allocation.value;
      group.subcategories.set(allocation.name,(group.subcategories.get(allocation.name)||0)+allocation.value);
    }));
    return[...map.values()].sort((a,b)=>b.total-a.total);
  };

  /*
    selectedRecords garante que a aba Categorias
    siga todos os filtros ativos.
  */
  const comparing=filters.month1&&filters.month2;

  if(comparing){
    const firstRecords=recordsForMonth(filters.month1);
    const secondRecords=recordsForMonth(filters.month2);
    const firstMap=mapFor(firstRecords);
    const secondMap=mapFor(secondRecords);
    const groupBySubcategory=new Map();

    [...firstRecords,...secondRecords].forEach(record=>{
      allocationsFor(record).forEach(allocation=>groupBySubcategory.set(allocation.name,allocationGroup(allocation)));
    });

    const rows=[...new Set([...firstMap.keys(),...secondMap.keys()])]
      .map(name=>{
        const first=firstMap.get(name)||0;
        const second=secondMap.get(name)||0;
        return{group:groupBySubcategory.get(name)||"Sem categoria",name,first,second,difference:second-first,percentage:variation(first,second)};
      })
      .sort((a,b)=>a.group.localeCompare(b.group,"pt-BR")||Math.abs(b.difference)-Math.abs(a.difference));
    const monthName=key=>`${MONTHS[Number(key.slice(5))-1]}/${key.slice(0,4)}`;
    const labels=[monthName(filters.month1),monthName(filters.month2)];

    app.append(
      sectionHeader("DETALHAMENTO","Categorias e subcategorias comparadas"),
      el("div",{class:"card tablewrap"},el("table",{class:"table"},[
        el("thead",{},el("tr",{},["Categoria","Subcategoria",labels[0],labels[1],"Diferença","Variação %"].map(value=>el("th",{},value)))),
        el("tbody",{},rows.map(item=>el("tr",{},[
          el("td",{},item.group),el("td",{},item.name),el("td",{},brl(item.first)),el("td",{},brl(item.second)),el("td",{},brl(item.difference)),
          el("td",{class:!Number.isFinite(item.percentage)?"neutral":item.percentage<=0?"positive":"negative"},Number.isFinite(item.percentage)?`${item.percentage>0?"+":""}${item.percentage.toFixed(1).replace(".",",")}%`:"—")
        ])))
      ]))
    );
    return;
  }

  const records=recordsForMonth(filters.month1);

  const groups=
    groupsFor(records);

  app.append(
    sectionHeader(
      "DETALHAMENTO",
      "Detalhamento por categoria (categoria › subcategoria)"
    ),

    el(
      "div",
      {class:"card"},

      groups.length
        ?groups.map(group=>
          el(
            "div",
            {class:"catgroup"},
            [
              el(
                "div",
                {class:"cathead"},
                [
                  el(
                    "span",
                    {},
                    group.label
                  ),

                  el(
                    "span",
                    {},
                    brl(group.total)
                  )
                ]
              ),

              ...[
                ...group.subcategories.entries()
              ]
                .sort(
                  (first,second)=>
                    second[1]-first[1]
                )
                .map(
                  ([name,value])=>
                    el(
                      "div",
                      {class:"catsub"},
                      [
                        el(
                          "span",
                          {},
                          name
                        ),

                        el(
                          "span",
                          {},
                          brl(value)
                        )
                      ]
                    )
                )
            ]
          )
        )
        :"Sem dados para os filtros atuais."
    )
  );
}

function activeFilterDescription(){
  const f=state.filters;
  const parts=[];
  const monthName=key=>key?`${MONTHS[Number(key.slice(5))-1]}/${key.slice(0,4)}`:"";
  if(f.compare){
    parts.push(`Período 1: ${f.period1From?formatDateBR(f.period1From):"início"} a ${f.period1To?formatDateBR(f.period1To):"fim"}`);
    parts.push(`Período 2: ${f.period2From?formatDateBR(f.period2From):"início"} a ${f.period2To?formatDateBR(f.period2To):"fim"}`);
  }else{
    if(f.dateFrom)parts.push(`Data inicial: ${formatDateBR(f.dateFrom)}`);
    if(f.dateTo)parts.push(`Data final: ${formatDateBR(f.dateTo)}`);
    if(!f.dateFrom&&!f.dateTo&&f.month1)parts.push(`Mês 1: ${monthName(f.month1)}`);
    if(!f.dateFrom&&!f.dateTo&&f.month2)parts.push(`Mês 2: ${monthName(f.month2)}`);
  }
  if(f.status)parts.push(`Situação: ${f.status}`);
  if(f.entity)parts.push(`${CONFIG[state.source]?.entityLabel||"Entidade"}: ${f.entity}`);
  if(f.groups.length)parts.push(`Categorias: ${f.groups.join(", ")}`);
  if(f.categories.length)parts.push(`Subcategorias: ${f.categories.join(", ")}`);
  if(f.costCenter)parts.push(`Centro de custo: ${f.costCenter}`);
  if(f.type)parts.push(`Tipo: ${f.type==="entry"?"Entradas":"Saídas"}`);
  return parts.length?parts.join(" · "):"Todos os dados carregados (sem filtros)";
}

function dashboardReportAnalysis(records,key){
  if(key==="extrato"){
    const entries=records.filter(record=>record.type==="entry").reduce((sum,record)=>sum+record.value,0);
    const exits=records.filter(record=>record.type==="exit").reduce((sum,record)=>sum+record.value,0);
    const balance=entries-exits;
    const months=monthlyStatementData();
    return{paragraphs:[
      `O extrato filtrado contém ${records.length} ${records.length===1?"lançamento":"lançamentos"}, com ${brl(entries)} em entradas e ${brl(exits)} em saídas. O saldo líquido do período é ${brl(balance)}.`,
      balance>=0?"As entradas superaram as saídas no período analisado, indicando geração positiva de caixa.":"As saídas superaram as entradas no período analisado. Recomenda-se revisar os maiores desembolsos e a disponibilidade de caixa para os próximos vencimentos.",
      `A análise considera ${months.length} ${months.length===1?"mês com movimentação":"meses com movimentação"} e respeita integralmente os filtros exibidos no relatório.`
    ],changes:[]};
  }

  const totals=accountTotals(records);
  const categories=[...categoryMap(records).entries()].sort((a,b)=>b[1]-a[1]);
  const months=monthlyAccountData(state.data[key]);
  const average=records.length?totals.total/records.length:0;
  const top=categories.slice(0,3);
  const topTotal=top.reduce((sum,[,value])=>sum+value,0);
  const concentration=totals.total?topTotal/totals.total*100:0;
  const highest=[...months].sort((a,b)=>b.value-a.value)[0];
  const lowest=[...months].sort((a,b)=>a.value-b.value)[0];

  if(key==="receber"){
    const receivedShare=totals.total?totals.done/totals.total*100:0;
    const openShare=totals.total?totals.open/totals.total*100:0;
    const lateShare=totals.total?totals.late/totals.total*100:0;
    return{paragraphs:[
      `O relatório de Contas a Receber considera ${records.length} ${records.length===1?"lançamento":"lançamentos"}, somando ${brl(totals.total)} em valores previstos de clientes. O valor médio por lançamento é de ${brl(average)}.`,
      `${brl(totals.done)} já foi recebido, equivalente a ${receivedShare.toFixed(1).replace(".",",")}% do total filtrado. Permanecem ${brl(totals.open)} a receber (${openShare.toFixed(1).replace(".",",")}%) e ${brl(totals.late)} em atraso (${lateShare.toFixed(1).replace(".",",")}%).`,
      totals.late>0?`Os recebimentos atrasados precisam de acompanhamento prioritário. Recomenda-se identificar os clientes e títulos vencidos de maior valor, reforçar as cobranças e avaliar o efeito da inadimplência sobre o fluxo de caixa.`:"Não foram encontrados recebimentos atrasados nos filtros atuais, indicando regularidade nos vencimentos analisados.",
      top.length?`As categorias de recebimento de maior peso são ${top.map(([name,value])=>`${name} (${brl(value)})`).join(", ")}. Juntas, concentram ${concentration.toFixed(1).replace(".",",")}% do valor previsto, ${concentration>=60?"o que demonstra dependência relevante dessas fontes de receita":"indicando uma composição mais distribuída das receitas"}.`:"Não foram encontradas categorias de recebimento com movimentação nos filtros atuais.",
      highest&&lowest&&highest.key!==lowest.key?`${highest.label} apresentou o maior volume previsto de recebimentos, com ${brl(highest.value)}, enquanto ${lowest.label} registrou o menor, com ${brl(lowest.value)}. A diferença foi de ${brl(highest.value-lowest.value)}.`:"Há somente um mês com movimentação nos filtros atuais; por isso, não é possível analisar a evolução mensal dos recebimentos.",
      `Foram identificados ${totals.entityCount} ${totals.entityCount===1?"cliente":"clientes"}. A leitura financeira deve considerar não apenas o crescimento do valor previsto, mas principalmente sua conversão em recebimentos efetivos e a evolução dos atrasos.`
    ],changes:[]};
  }

  return{paragraphs:[
    `O relatório considera ${records.length} ${records.length===1?"lançamento":"lançamentos"}, totalizando ${brl(totals.total)}. O valor médio por lançamento foi de ${brl(average)}.`,
    `${brl(totals.done)} já foi ${CONFIG[key].doneLabel.toLowerCase()}, ${brl(totals.open)} permanece ${CONFIG[key].openLabel.toLowerCase()} e ${brl(totals.late)} está atrasado. ${totals.late>0?"O saldo atrasado deve ser acompanhado com prioridade para reduzir juros, multas e impacto no caixa.":"Não foram encontrados valores atrasados nos filtros atuais."}`,
    top.length?`As subcategorias de maior peso foram ${top.map(([name,value])=>`${name} (${brl(value)})`).join(", ")}. Juntas, representam ${concentration.toFixed(1).replace(".",",")}% do total filtrado.`:"Não foram encontradas subcategorias com movimentação nos filtros atuais.",
    highest&&lowest&&highest.key!==lowest.key?`${highest.label} apresentou o maior valor, com ${brl(highest.value)}, enquanto ${lowest.label} apresentou o menor, com ${brl(lowest.value)}. A diferença entre eles foi de ${brl(highest.value-lowest.value)}.`:"Há somente um mês com movimentação nos filtros atuais; por isso, não é possível avaliar a evolução entre meses.",
    `Foram identificados ${totals.entityCount} ${totals.entityCount===1?CONFIG[key].entityLabel.toLowerCase():`${CONFIG[key].entityLabel.toLowerCase()}s`} no período selecionado. Todos os indicadores, rankings e detalhamentos deste relatório foram calculados conforme os filtros ativos no Dashboard.`
  ],changes:[]};
}

function reportData(){
  const key=state.source;
  const records=displayRecords(state.data[key]);
  if(key==="extrato"){
    const entries=records.filter(record=>record.type==="entry").reduce((sum,record)=>sum+record.value,0);
    const exits=records.filter(record=>record.type==="exit").reduce((sum,record)=>sum+record.value,0);
    return{key,records,filterDescription:activeFilterDescription(),entries,exits,balance:entries-exits,months:monthlyStatementData(),analysis:dashboardReportAnalysis(records,key),suppliers:[],costCenters:[],groups:[]};
  }
  const comparing=state.filters.compare||(state.filters.month1&&state.filters.month2&&!state.filters.dateFrom&&!state.filters.dateTo);
  return{
    key,records,config:CONFIG[key],filterDescription:activeFilterDescription(),totals:accountTotals(records),
    suppliers:rankingData(state.data[key],"entity"),costCenters:rankingData(state.data[key],"costCenter"),
    groups:categoryGroups(records),months:monthlyAccountData(state.data[key]),
    analysis:comparing?comparisonInformation():dashboardReportAnalysis(records,key)
  };
}

async function uploadFile(key,file){
  if(!file)return;

  if(cloudDb&&!adminSession){
    showAdminLogin();
    return;
  }

  try{
    state.error="";

    if(key==="extrato"){
      const result=
        await parseStatement(file);

      state.data.extrato=
        result.records;

      state.balance=
        result.balance;
    }else{
      state.data[key]=
        await parseAccounts(
          file,
          key
        );
    }

    state.updated[key]=
      new Date().toISOString();

    state.filters=
      freshFilters();

    saveData(key);

    if(cloudDb){
      await saveOnline();
    }
  }catch(error){
    state.error=
      error.message||
      "Não foi possível ler o arquivo.";
  }

  render();
}

function renderEmpty(){
  const label=
    CONFIG[state.source]?.label||
    "Extrato Bancário";

  const container=el(
    "div",
    {class:"empty"},
    [
      el(
        "p",
        {},
        `Carregue o arquivo de ${label} para visualizar esta área.`
      )
    ]
  );

  if(cloudDb&&!adminSession){
    container.append(el("button",{class:"btn",onclick:showAdminLogin},"Entrar como administrador para importar"));
    return container;
  }

  const drop=el(
    "div",
    {class:"drop"},
    "⬆ Arraste o arquivo aqui ou clique para escolher"
  );

  const input=el(
    "input",
    {
      type:"file",
      accept:".xlsx,.xls,.csv",

      onchange:event=>
        uploadFile(
          state.source,
          event.target.files[0]
        )
    }
  );

  drop.onclick=()=>input.click();

  drop.ondragover=event=>{
    event.preventDefault();
    drop.classList.add("over");
  };

  drop.ondragleave=()=>{
    drop.classList.remove("over");
  };

  drop.ondrop=event=>{
    event.preventDefault();

    drop.classList.remove(
      "over"
    );

    uploadFile(
      state.source,
      event.dataTransfer.files[0]
    );
  };

  container.append(
    drop,
    input
  );

  return container;
}

async function clearCurrentData(){
  if(cloudDb&&!adminSession){showAdminLogin();return}
  const label=
    CONFIG[state.source]?.label||
    "Extrato Bancário";

  if(
    !confirm(
      `Apagar os dados de ${label}?`
    )
  ){
    return;
  }

  localStorage.removeItem(
    `dane-se-dashboard-${state.source}-v10`
  );

  state.data[state.source]=null;

  if(state.source==="extrato"){
    state.balance=null;
  }

  state.filters=freshFilters();
  if(cloudDb){
    try{await saveOnline()}catch(error){state.error="Não foi possível atualizar os dados compartilhados."}
  }
  render();
}

function render(){
  const app=
    document.getElementById("app");

  app.innerHTML="";

  const sourceTabs=[
    ["pagar","Contas a Pagar"],
    ["receber","Contas a Receber"],
    ["extrato","Extrato Bancário"]
  ];

  const viewTabs=[
    ["dashboard","Dashboard"],
    ["relatorio","Relatório Executivo"],
    ["comparacao","Comparação"],
    ["categorias","Categorias"]
  ];

  if(state.view==="graficos")state.view="dashboard";

  const updated=
    state.updated[state.source]
      ?new Date(
        state.updated[state.source]
      ).toLocaleString("pt-BR")
      :"—";

  app.append(
    el(
      "div",
      {class:"header"},
      [
        el(
          "div",
          {},
          [
            el(
              "div",
              {class:"eyebrow"},
              "DASHBOARD FINANCEIRO"
            ),

            el(
              "h1",
              {class:"title"},
              "Dane-se · Painel financeiro"
            ),

            el(
              "div",
              {class:"sub"},

              state.data[state.source]
                ?`Atualizado em ${updated} · ${state.data[state.source].length} lançamentos carregados`
                :"Dados processados localmente no navegador"
            )
          ]
        ),

        el(
          "div",
          {class:"actions"},
          [
            el("span",{class:`adminBadge${cloudReady?" online":""}`},cloudReady?(adminSession?"Administrador conectado":"Dados compartilhados online"):"Modo local"),

            cloudDb
              ?el("button",{class:"btn secondary",onclick:adminSession?adminLogout:showAdminLogin},adminSession?"Sair":"Área administrativa")
              :null,

            el(
              "button",
              {
                class:"btn secondary",
                onclick:downloadPDF
              },
              "Baixar PDF"
            ),

            el(
              "button",
              {
                class:"btn secondary",
                onclick:downloadExcel
              },
              "Baixar Excel"
            ),

            state.data[state.source]&&(!cloudDb||adminSession)
              ?el(
                "button",
                {
                  class:"btn",

                  onclick:()=>{
                    document
                      .getElementById(
                        "main-file"
                      )
                      ?.click();
                  }
                },
                "⟳ Atualizar dados"
              )
              :null,

            state.data[state.source]&&(!cloudDb||adminSession)
              ?el(
                "button",
                {
                  class:"btn danger",
                  onclick:clearCurrentData
                },
                "🗑 Limpar"
              )
              :null
          ]
        )
      ]
    ),

    el(
      "div",
      {class:"tabs"},

      sourceTabs.map(
        ([key,label])=>
          el(
            "button",
            {
              class:
                `tab${state.source===key
                  ?" active"
                  :""}`,

              onclick:()=>{
                state.source=key;

                state.filters=
                  freshFilters();

                state.categoryFilters=
                  freshCategoryFilters();

                render();
              }
            },
            label
          )
      )
    ),

    el(
      "div",
      {class:"tabs viewtabs"},

      viewTabs.map(
        ([key,label])=>
          el(
            "button",
            {
              class:
                `tab${state.view===key
                  ?" active"
                  :""}`,

              onclick:()=>{
                state.view=key;
                render();
              }
            },
            label
          )
      )
    )
  );

  if(state.error){
    app.append(
      el(
        "div",
        {class:"error"},
        `⚠ ${state.error}`
      )
    );
  }

  if(!state.data[state.source]){
    app.append(
      renderEmpty()
    );

    return;
  }

  app.append(
    state.view==="categorias"
      ?renderCategoryFilters()
      :renderFilters()
  );

  if(state.view==="dashboard"){
    if(
      state.source==="pagar"||
      state.source==="receber"
    ){
      renderAccountsDashboard(
        app,
        state.source
      );
    }else{
      renderStatementDashboard(app);
    }
  }else if(state.view==="relatorio"){
    app.append(renderAnalysis());
  }else if(
    state.view==="comparacao"
  ){
    renderExpenseComparison(app);
  }else if(
    state.view==="categorias"
  ){
    renderCategories(app);
  }

  app.append(
    el(
      "input",
      {
        id:"main-file",
        type:"file",
        accept:".xlsx,.xls,.csv",

        onchange:event=>
          uploadFile(
            state.source,
            event.target.files[0]
          )
      }
    ),

    el(
      "div",
      {class:"footer"},
      cloudReady
        ?"Dados compartilhados online · atualização automática para todas as pessoas com o link · análise executiva"
        :"Cópia local de segurança · configure o Supabase para compartilhamento online"
    )
  );
}

loadData();
render();
initOnline();
</script>
</body>
</html>
