<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Financeiro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#10234a;
  --paper:#fffaf2;
  --dim:#f4ead9;
  --gold:#d89a22;
  --sage:#287a4b;
  --rust:#c5442e;
  --line:#d9c7a6;
  --muted:#514b40;
  --white:#fff;
  --blue:#2457a7;
  --cyan:#168a9c;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Inter,sans-serif;
}

.wrap{
  max-width:1220px;
  margin:auto;
  padding:28px 24px 50px;
}

.eyebrow{
  font:11px "IBM Plex Mono";
  color:var(--gold);
  letter-spacing:.08em;
}

.title{
  font:600 28px Fraunces;
  margin:3px 0;
}

.sub{
  font:12px "IBM Plex Mono";
  color:var(--muted);
  margin-top:4px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:#fff;
  padding:9px 14px;
  border-radius:7px;
  cursor:pointer;
  font-weight:600;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 12px rgba(16,35,74,.18);
}

.btn.secondary{
  background:#fff;
  color:var(--blue);
  border-color:var(--blue);
}

.btn.danger{
  background:#fff;
  color:var(--rust);
  border-color:var(--rust);
}

.tabs{
  display:flex;
  gap:4px;
  border-bottom:1px solid var(--line);
  margin-bottom:20px;
  overflow-x:auto;
}

.tab{
  white-space:nowrap;
  border:0;
  background:none;
  padding:11px 15px;
  margin-bottom:-1px;
  border-bottom:3px solid transparent;
  color:var(--muted);
  cursor:pointer;
  font:12px "IBM Plex Mono";
}

.tab.active{
  color:var(--ink);
  font-weight:600;
  border-bottom-color:var(--gold);
}

.viewtabs{
  margin-top:-8px;
  margin-bottom:22px;
}

.filterbox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  margin-bottom:22px;
  box-shadow:0 5px 16px rgba(16,35,74,.06);
}

.filters{
  display:flex;
  gap:10px;
  align-items:flex-end;
  flex-wrap:wrap;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:145px;
}

.field label{
  font:10px "IBM Plex Mono";
  text-transform:uppercase;
  color:var(--muted);
}

.field input,
.field select{
  height:36px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  color:var(--ink);
  padding:0 9px;
  font:12px Inter;
}

.compareToggle{
  display:flex;
  align-items:center;
  gap:7px;
  height:36px;
  font-size:12px;
}

.compareDates{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  width:100%;
  padding-top:12px;
  margin-top:4px;
  border-top:1px solid var(--line);
}

.multi{
  position:relative;
}

.multi summary{
  height:36px;
  display:flex;
  align-items:center;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  cursor:pointer;
  font-size:12px;
  min-width:190px;
}

.multiPanel{
  position:absolute;
  top:58px;
  left:0;
  z-index:30;
  width:290px;
  max-height:270px;
  overflow:auto;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 12px 30px rgba(16,35,74,.22);
  border-radius:8px;
  padding:8px;
}

.multiActions{
  display:flex;
  gap:6px;
  padding-bottom:7px;
  margin-bottom:5px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:-8px;
  background:#fff;
  z-index:2;
  padding-top:4px;
}

.multiActions button{
  flex:1;
  border:1px solid var(--line);
  background:var(--dim);
  border-radius:4px;
  padding:5px;
  cursor:pointer;
  font-size:10px;
}

.multiOpt{
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px;
  font-size:12px;
  cursor:pointer;
  border-radius:4px;
}

.multiOpt:hover{
  background:var(--dim);
}

.kpis{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:14px;
  margin-bottom:28px;
}

.kpi{
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px 14px 5px 14px;
  padding:18px;
  min-width:0;
  box-shadow:0 6px 18px rgba(16,35,74,.10);
}

.kpi.primary{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

.kpi.paid{
  border-top:5px solid var(--sage);
}

.kpi.open{
  border-top:5px solid var(--gold);
}

.kpi.late{
  background:var(--rust);
  color:#fff;
  border-color:var(--rust);
}

.kpi.entity{
  background:var(--gold);
  color:#2a1d08;
  border-color:var(--gold);
}

.kpi.entry{
  background:var(--sage);
  color:#fff;
  border-color:var(--sage);
}

.kpi.exit{
  background:var(--rust);
  color:#fff;
  border-color:var(--rust);
}

.kpi .label{
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  opacity:.78;
}

.kpi .value{
  font:600 23px Fraunces;
  margin:8px 0 5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.kpi .detail{
  font:11px "IBM Plex Mono";
  opacity:.75;
}

.section{
  display:flex;
  align-items:center;
  gap:10px;
  margin:25px 0 13px;
}

.section h2{
  font:600 19px Fraunces;
  margin:0;
}

.rule{
  height:1px;
  background:var(--line);
  flex:1;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:11px;
  padding:17px;
  margin-bottom:22px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(16,35,74,.06);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.chart{
  width:100%;
  overflow-x:auto;
}

.chart svg{
  display:block;
  min-width:680px;
}

.legend{
  display:flex;
  gap:16px;
  font:11px "IBM Plex Mono";
  color:var(--muted);
  margin-bottom:10px;
}

.legendItem{
  display:flex;
  align-items:center;
  gap:6px;
}

.legendColor{
  width:10px;
  height:10px;
  border-radius:2px;
}

.rankScroll{
  max-height:310px;
  overflow-y:auto;
  padding-right:8px;
}

.rankScroll::-webkit-scrollbar,
.tablewrap::-webkit-scrollbar,
.multiPanel::-webkit-scrollbar{
  width:8px;
  height:8px;
}

.rankScroll::-webkit-scrollbar-thumb,
.tablewrap::-webkit-scrollbar-thumb,
.multiPanel::-webkit-scrollbar-thumb{
  background:var(--gold);
  border-radius:8px;
}

.ranking{
  display:flex;
  align-items:center;
  gap:9px;
  margin:10px 0;
}

.rankname{
  width:175px;
  flex-shrink:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
}

.track{
  height:22px;
  background:var(--dim);
  border-radius:4px;
  flex:1;
  overflow:hidden;
}

.fill{
  height:100%;
  border-radius:4px;
}

.rankvalue{
  width:108px;
  flex-shrink:0;
  text-align:right;
  font:11px "IBM Plex Mono";
}

.tablewrap{
  overflow:auto;
  max-height:430px;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}

.table th,
.table td{
  text-align:right;
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.table th:first-child,
.table td:first-child{
  text-align:left;
}

.table th{
  font:10px "IBM Plex Mono";
  text-transform:uppercase;
  color:#fff;
  background:var(--ink);
  position:sticky;
  top:0;
  z-index:2;
}

.table tbody tr:hover{
  background:#fff6e6;
}

.positive{
  color:var(--sage);
  font-weight:600;
}

.negative{
  color:var(--rust);
  font-weight:600;
}

.neutral{
  color:var(--muted);
}

.analysis{
  line-height:1.7;
  font-size:13px;
  border-left:5px solid var(--gold);
}

.analysisLead{
  font:600 17px Fraunces;
  margin-bottom:14px;
}

.analysisList{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.insight{
  background:#fff2d8;
  border:1px solid #edcf91;
  border-radius:7px;
  padding:12px;
}

.catgroup{
  margin-bottom:22px;
}

.cathead{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:2px solid var(--line);
  font:600 16px Fraunces;
  color:var(--ink);
}

.catsub{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0 8px 24px;
  color:var(--muted);
  font-size:12px;
}

.catsub:hover{
  background:#fff6e6;
}

.cathead span:last-child,
.catsub span:last-child{
  font-family:"IBM Plex Mono";
  white-space:nowrap;
}

.empty{
  text-align:center;
  max-width:680px;
  margin:45px auto;
}

.drop{
  border:2px dashed var(--gold);
  border-radius:12px;
  padding:38px 20px;
  cursor:pointer;
  background:#fff;
}

.drop.over{
  border-color:var(--blue);
  background:var(--dim);
}

.error{
  color:var(--rust);
  font-size:12px;
  margin:10px 0;
}

.footer{
  text-align:center;
  font:10px "IBM Plex Mono";
  color:var(--muted);
  margin-top:28px;
}

input[type=file]{
  display:none;
}

@media(max-width:950px){
  .kpis{
    grid-template-columns:1fr 1fr;
  }

  .grid2,
  .analysisList{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .wrap{
    padding:20px 14px 40px;
  }

  .kpis{
    grid-template-columns:1fr;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .field{
    flex:1 1 140px;
  }

  .multi{
    flex:1 1 190px;
  }

  .rankname{
    width:125px;
  }
}
</style>
</head>

<body>
<main class="wrap" id="app"></main>

<script>
const MONTHS=[
  "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
  "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
];

const ABBR=[
  "jan","fev","mar","abr","mai","jun",
  "jul","ago","set","out","nov","dez"
];

const GROUP_LABELS={
  "2.01":"Ocupação e Instalações",
  "2.02":"Produção e Insumos",
  "2.03":"Salários, Benefícios e Encargos",
  "2.04":"Comercial e Vendas",
  "2.05":"Marketing e Publicidade",
  "2.06":"Impostos sobre Vendas",
  "2.07":"Parcelamentos Tributários",
  "2.08":"Tarifas e Encargos Bancários",
  "2.09":"Serviços Profissionais",
  "2.10":"Softwares e TI",
  "2.11":"Despesas Administrativas",
  "2.12":"Despesas Variáveis / Sócios"
};

const CONFIG={
  pagar:{
    label:"Contas a Pagar",
    sheetRegex:/contas a pagar/i,
    entityHeaders:["Nome do fornecedor"],
    entityLabel:"Fornecedor",
    doneHeaders:["Valor total pago da parcela (R$)"],
    doneLabel:"Pago",
    openLabel:"Em aberto"
  },

  receber:{
    label:"Contas a Receber",
    sheetRegex:/contas a receber/i,
    entityHeaders:[
      "Nome do cliente",
      "Nome do contato",
      "Nome do fornecedor"
    ],
    entityLabel:"Cliente",
    doneHeaders:[
      "Valor total recebido da parcela (R$)",
      "Valor total pago da parcela (R$)"
    ],
    doneLabel:"Recebido",
    openLabel:"A receber"
  }
};

const brl=value=>
  new Intl.NumberFormat("pt-BR",{
    style:"currency",
    currency:"BRL",
    maximumFractionDigits:0
  }).format(Number(value)||0);

function createElement(tag,attributes={},children=[]){
  const element=document.createElement(tag);

  Object.entries(attributes).forEach(([key,value])=>{
    if(key.startsWith("on")){
      element.addEventListener(key.slice(2),value);
    }else if(key==="class"){
      element.className=value;
    }else if(key==="html"){
      element.innerHTML=value;
    }else{
      element.setAttribute(key,value);
    }
  });

  (Array.isArray(children)?children:[children]).forEach(child=>{
    if(child===null||child===undefined||child===false)return;

    element.appendChild(
      typeof child==="string"
        ?document.createTextNode(child)
        :child
    );
  });

  return element;
}

const normalize=value=>
  (value||"").toString().trim().toLowerCase();

function findColumn(headers,names){
  const wanted=names.map(normalize);

  return headers.findIndex(header=>
    wanted.includes(normalize(header))
  );
}

function parseNumber(value){
  if(typeof value==="number")return value;

  let text=(value||"").toString().trim();

  if(
    text.includes(",")&&
    text.lastIndexOf(",")>text.lastIndexOf(".")
  ){
    text=text.replace(/\./g,"").replace(",",".");
  }

  const number=parseFloat(text.replace(/[^\d.-]/g,""));
  return Number.isNaN(number)?0:number;
}

function parseDate(value){
  if(value instanceof Date)return value;

  if(typeof value==="number"&&value>20000){
    const date=new Date(Math.round((value-25569)*86400000));

    return new Date(
      date.getUTCFullYear(),
      date.getUTCMonth(),
      date.getUTCDate()
    );
  }

  const text=(value||"").toString().trim();

  let match=text.match(
    /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/
  );

  if(match){
    const year=match[3].length===2
      ?Number(`20${match[3]}`)
      :Number(match[3]);

    return new Date(
      year,
      Number(match[2])-1,
      Number(match[1])
    );
  }

  match=text.match(/^(\d{4})-(\d{2})-(\d{2})/);

  return match
    ?new Date(
      Number(match[1]),
      Number(match[2])-1,
      Number(match[3])
    )
    :null;
}

function dateToISO(date){
  if(!date)return "";

  return[
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function parseCategory(raw){
  const text=(raw||"").toString().trim();

  const match=text.match(
    /^(\d+(?:\.\d+)+)\s*[-–.]?\s*(.*)$/
  );

  if(match&&match[2]){
    return{
      code:match[1],
      name:match[2].trim()
    };
  }

  return{
    code:"",
    name:
      text.replace(/^[\d.]+\s*/,"").trim()||
      "Sem categoria"
  };
}

async function parseAccounts(file,key){
  const config=CONFIG[key];

  const workbook=XLSX.read(
    await file.arrayBuffer(),
    {type:"array"}
  );

  const sheetName=
    workbook.SheetNames.find(name=>
      config.sheetRegex.test(name)
    )||workbook.SheetNames[0];

  const worksheet=workbook.Sheets[sheetName];

  const rows=XLSX.utils.sheet_to_json(
    worksheet,
    {
      header:1,
      raw:true,
      defval:""
    }
  );

  const headerIndex=rows.findIndex(row=>
    config.entityHeaders.some(name=>
      row.some(cell=>
        normalize(cell)===normalize(name)
      )
    )
  );

  if(headerIndex<0){
    throw new Error(
      `Não reconheci o relatório de ${config.label}. `+
      "Exporte novamente pelo Conta Azul sem alterar os cabeçalhos."
    );
  }

  const headers=rows[headerIndex];

  const columns={
    entity:findColumn(headers,config.entityHeaders),
    date:findColumn(headers,["Data de vencimento"]),
    status:findColumn(headers,["Situação"]),
    original:findColumn(
      headers,
      ["Valor original da parcela (R$)"]
    ),
    done:findColumn(headers,config.doneHeaders),
    open:findColumn(
      headers,
      ["Valor total da parcela em aberto (R$)"]
    ),
    costCenter:findColumn(
      headers,
      ["Centro de Custo 1"]
    )
  };

  if(
    columns.entity<0||
    columns.date<0||
    columns.original<0
  ){
    throw new Error(
      "Faltam colunas obrigatórias no arquivo."
    );
  }

  const categoryColumns=[];

  for(let index=1;index<=12;index++){
    const categoryIndex=findColumn(
      headers,
      [`Categoria ${index}`]
    );

    if(categoryIndex>=0){
      categoryColumns.push({
        categoryIndex,
        valueIndex:findColumn(
          headers,
          [`Valor na Categoria ${index}`]
        )
      });
    }
  }

  const records=[];

  rows.slice(headerIndex+1).forEach(row=>{
    const date=parseDate(row[columns.date]);

    if(!date)return;

    const original=Math.abs(
      parseNumber(row[columns.original])
    );

    const allocations=[];

    categoryColumns.forEach(column=>{
      const raw=row[column.categoryIndex];

      if(!String(raw||"").trim())return;

      const category=parseCategory(raw);

      allocations.push({
        code:category.code,
        name:category.name,
        value:Math.abs(
          parseNumber(row[column.valueIndex])
        )
      });
    });

    if(!allocations.length){
      allocations.push({
        code:"",
        name:"Sem categoria",
        value:original
      });
    }else if(
      !allocations.some(allocation=>allocation.value)
    ){
      allocations[0].value=original;
    }

    const formattedDate=dateToISO(date);

    records.push({
      entity:String(
        row[columns.entity]||
        `Sem ${config.entityLabel.toLowerCase()}`
      ).trim(),

      status:String(
        row[columns.status]||
        "Não informado"
      ).trim(),

      original,

      done:Math.abs(
        parseNumber(row[columns.done])
      ),

      open:Math.abs(
        parseNumber(row[columns.open])
      ),

      costCenter:
        columns.costCenter>=0
          ?String(
            row[columns.costCenter]||
            "Sem centro de custo"
          ).trim()
          :"Sem centro de custo",

      allocations,
      date:formattedDate,
      month:formattedDate.slice(0,7)
    });
  });

  if(!records.length){
    throw new Error(
      "Nenhum lançamento válido foi encontrado."
    );
  }

  return records;
}

async function parseStatement(file){
  const workbook=XLSX.read(
    await file.arrayBuffer(),
    {type:"array"}
  );

  const sheetName=
    workbook.SheetNames.find(name=>
      /extrato/i.test(name)
    )||workbook.SheetNames[0];

  const worksheet=workbook.Sheets[sheetName];

  const rows=XLSX.utils.sheet_to_json(
    worksheet,
    {
      header:1,
      raw:true,
      defval:""
    }
  );

  const dateHeaders=[
    "Data",
    "Data do Lançamento",
    "Data Lançamento",
    "Data lançamento"
  ];

  const valueHeaders=[
    "Valor",
    "Valor (R$)",
    "Valor R$",
    "Valor da Transação",
    "Valor da transacao"
  ];

  const headerIndex=rows.findIndex(row=>
    findColumn(row,dateHeaders)>=0&&
    findColumn(row,valueHeaders)>=0
  );

  if(headerIndex<0){
    throw new Error(
      "Não reconheci o extrato. Preciso das colunas Data e Valor."
    );
  }

  const headers=rows[headerIndex];

  const columns={
    date:findColumn(headers,dateHeaders),
    value:findColumn(headers,valueHeaders),

    description:findColumn(
      headers,
      [
        "Descrição",
        "Histórico",
        "Descricao",
        "Historico",
        "Complemento",
        "Detalhes"
      ]
    ),

    type:findColumn(
      headers,
      [
        "Tipo",
        "Natureza",
        "D/C",
        "Tipo Lançamento"
      ]
    ),

    balance:findColumn(
      headers,
      [
        "Saldo",
        "Saldo (R$)",
        "Saldo Final",
        "Saldo final"
      ]
    )
  };

  let balance=null;
  const records=[];

  rows.slice(headerIndex+1).forEach(row=>{
    const date=parseDate(row[columns.date]);

    if(!date)return;

    const rawValue=parseNumber(row[columns.value]);
    const rawType=normalize(row[columns.type]);

    let type;

    if(rawType.startsWith("d")){
      type="exit";
    }else if(rawType.startsWith("c")){
      type="entry";
    }else{
      type=rawValue<0?"exit":"entry";
    }

    if(
      columns.balance>=0&&
      row[columns.balance]!==""
    ){
      balance=parseNumber(row[columns.balance]);
    }

    const formattedDate=dateToISO(date);

    records.push({
      date:formattedDate,
      month:formattedDate.slice(0,7),
      value:Math.abs(rawValue),
      type,
      description:String(
        row[columns.description]||
        "Sem descrição"
      ).trim()
    });
  });

  if(!records.length){
    throw new Error(
      "Nenhum lançamento válido foi encontrado no extrato."
    );
  }

  return{records,balance};
}

    ...new Set(all.map(record=>record.month))

    .sort()
    .map(key=>({

function baseFilter(records){
  const filters=state.filters;

  return(records||[])
    .filter(record=>
      !filters.status||
      record.status===filters.status
    )
    .filter(record=>
      !filters.entity||
      record.entity===filters.entity
    )
    .filter(record=>
      !filters.costCenter||
      record.costCenter===filters.costCenter
    )
    .filter(record=>
      !filters.categories.length||
      record.allocations?.some(allocation=>
        filters.categories.includes(allocation.name)
      )
    )
    .filter(record=>
      !filters.type||
      record.type===filters.type
    );
}

function periodFilter(records,period=0){
  const filters=state.filters;

  let from="";
  let to="";
  let month="";

  if(filters.compare){
    if(period===1){
      from=filters.period1From;
      to=filters.period1To;
    }else{
      from=filters.period2From;
      to=filters.period2To;
    }
  }else{
    from=filters.dateFrom;
    to=filters.dateTo;

    month=
      period===1
        ?filters.month1
        :period===2
          ?filters.month2
          :"";
  }

  return baseFilter(records)
    .filter(record=>
      !from||record.date>=from
    )
    .filter(record=>
      !to||record.date<=to
    )
    .filter(record=>
      !month||record.month===month
    );
}

function selectedPeriodRecords(records){
  return periodFilter(
    records,
    state.filters.compare||state.filters.month2
      ?2
      :1
  );
}

function variation(firstValue,secondValue){
  if(firstValue===0){
    return secondValue===0?0:NaN;
  }

  return(
    (secondValue-firstValue)/
    Math.abs(firstValue)
  )*100;
}

function percentageText(firstValue,secondValue){
  const value=variation(firstValue,secondValue);

  if(!Number.isFinite(value))return "—";

  return`${value>0?"+":""}${value.toFixed(1).replace(".",",")}%`;
}

function periodLabels(){
  const filters=state.filters;

      `${filters.period2From||"início"} a ${filters.period2To||"fim"}`
    ];
  }

  return[
    monthName(filters.month1),
    monthName(filters.month2)
  ];
}

function categoryMap(records){
  const map=new Map();

  records.forEach(record=>{
    record.allocations?.forEach(allocation=>{
      map.set(
        allocation.name,
        (map.get(allocation.name)||0)+
        allocation.value
      );
    });
  });

  return map;
}

function categoryGroups(records){
  const groups=new Map();

  records.forEach(record=>{
    record.allocations?.forEach(allocation=>{
      const parts=(allocation.code||"").split(".");

      const key=
        parts.length>=2
          ?parts.slice(0,2).join(".")
          :allocation.name;

      const label=
        GROUP_LABELS[key]||
        allocation.name;

      if(!groups.has(key)){
        groups.set(key,{
          label,
          total:0,
          subcategories:new Map()
        });
      }

      const group=groups.get(key);
      group.total+=allocation.value;

      group.subcategories.set(
        allocation.name,
        (
          group.subcategories.get(
            allocation.name
          )||0
        )+allocation.value
      );
    });
  });

  return[
    ...groups.values()
  ].sort(
    (first,second)=>
      second.total-first.total
  );
}

function rankingData(records,property){
  const map=new Map();

  records.forEach(record=>{
    map.set(
      record[property],
      (
        map.get(record[property])||0
      )+record.original
    );
  });

  return[
    ...map.entries()
  ].sort(
    (first,second)=>
      second[1]-first[1]
  );
}

function barChart(data,color){
  const width=1000;
  const height=280;
  const left=65;
  const bottom=35;

  const maximum=Math.max(
    1,
    ...data.map(item=>item.value)
  );

  const gap=
    (width-left-20)/
    Math.max(data.length,1);

  const barWidth=Math.min(70,gap*.62);

  const svg=document.createElementNS(
    "http://www.w3.org/2000/svg",
    "svg"
  );

  svg.setAttribute(
    "viewBox",
    `0 0 ${width} ${height}`
  );

  data.forEach((item,index)=>{
    const barHeight=
      (height-bottom-20)*
      (item.value/maximum);

    const x=
      left+
      index*gap+
      (gap-barWidth)/2;

    const y=
      height-
      bottom-
      barHeight;

    const rectangle=
      document.createElementNS(
        svg.namespaceURI,
        "rect"
      );

    rectangle.setAttribute("x",x);
    rectangle.setAttribute("y",y);
    rectangle.setAttribute("width",barWidth);
    rectangle.setAttribute("height",barHeight);
    rectangle.setAttribute("rx",4);
    rectangle.setAttribute("fill",color);

    const tooltip=
      document.createElementNS(
        svg.namespaceURI,
        "title"
      );

    tooltip.textContent=
      `${item.label}: ${brl(item.value)}`;

    rectangle.append(tooltip);
    svg.append(rectangle);

    const label=
      document.createElementNS(
        svg.namespaceURI,
        "text"
      );

    label.setAttribute(
      "x",
      x+barWidth/2
    );

    label.setAttribute(
      "y",
      height-10
    );

    label.setAttribute(
      "text-anchor",
      "middle"
    );

    label.setAttribute(
      "font-size",
      "10"
    );

    label.textContent=item.label;
    svg.append(label);
  });

  return createElement(
    "div",
    {class:"chart"},
    svg
  );
}

function comparisonInformation(){
  const firstRecords=periodFilter(
    state.data.pagar,
    1
  );

  const secondRecords=periodFilter(
    state.data.pagar,
    2
  );

  const firstTotal=firstRecords.reduce(
    (sum,record)=>sum+record.original,
    0
  );

  const secondTotal=secondRecords.reduce(
    (sum,record)=>sum+record.original,
    0
  );

  const firstCategories=categoryMap(firstRecords);
  const secondCategories=categoryMap(secondRecords);

  const changes=[
    ...new Set([
      ...firstCategories.keys(),
      ...secondCategories.keys()
    ])
  ]
    .map(name=>{
      const firstValue=
        firstCategories.get(name)||0;

      const secondValue=
        secondCategories.get(name)||0;

      return{
        name,
        firstValue,
        secondValue,
        difference:
          secondValue-firstValue,

        percentage:
          variation(
            firstValue,
            secondValue
          )
      };
    })
    .sort(
      (first,second)=>
        Math.abs(second.difference)-
        Math.abs(first.difference)
    );

  const biggestIncrease=[
    ...changes
  ]
    .filter(item=>item.difference>0)
    .sort(
      (first,second)=>
        second.difference-
        first.difference
    )[0];

  const biggestReduction=[
    ...changes
  ]
    .filter(item=>item.difference<0)
    .sort(
      (first,second)=>
        first.difference-
        second.difference
    )[0];

  const biggestImpact=changes[0];

  const newExpenses=changes.filter(
    item=>
      item.firstValue===0&&
      item.secondValue>0
  );

  const removedExpenses=changes.filter(
    item=>
      item.firstValue>0&&
      item.secondValue===0
  );

  const totalDifference=
    secondTotal-firstTotal;

  const totalPercentage=
    variation(firstTotal,secondTotal);

  const labels=periodLabels();

  const parts=[
    `Na comparação entre ${labels[0]} e ${labels[1]}, `+
    `as despesas ${totalDifference<=0?"diminuíram":"aumentaram"} `+
    `${brl(Math.abs(totalDifference))}`+
    (
      Number.isFinite(totalPercentage)
        ?`, representando ${Math.abs(totalPercentage)
          .toFixed(1)
          .replace(".",",")}% de `+
          `${totalDifference<=0?"redução":"aumento"}.`
        :"."
    )
  ];

  if(biggestIncrease){
    parts.push(
      `O maior aumento ocorreu em ${biggestIncrease.name}, `+
      `com crescimento de ${brl(biggestIncrease.difference)}.`
    );
  }else{
    parts.push(
      "Nenhuma subcategoria apresentou aumento no período."
    );
  }

  if(biggestReduction){
    parts.push(
      `A maior redução ocorreu em ${biggestReduction.name}, `+
      `com queda de ${brl(Math.abs(biggestReduction.difference))}.`
    );
  }else{
    parts.push(
      "Nenhuma subcategoria apresentou redução no período."
    );
  }

  if(biggestImpact){
    parts.push(
      `${biggestImpact.name} foi a despesa de maior impacto `+
      "na variação total observada."
    );
  }

  if(newExpenses.length){
    parts.push(
      `${newExpenses.length} despesa(s) apareceram somente no segundo período.`
    );
  }

  if(removedExpenses.length){
    parts.push(
      `${removedExpenses.length} despesa(s) deixaram de aparecer no segundo período.`
    );
  }

  if(totalDifference>0){
    parts.push(
      "Ponto de atenção: houve aumento no custo total. " +
      "Recomenda-se revisar as subcategorias com maior crescimento."
    );
  }else if(totalDifference<0){
    parts.push(
      "O período apresentou redução geral das despesas. " +
      "Vale confirmar se a queda representa economia recorrente ou apenas mudança de vencimentos."
    );
  }

  return{
    firstRecords,
    secondRecords,
    firstTotal,
    secondTotal,
    totalDifference,
    totalPercentage,
    changes,
    biggestIncrease,
    biggestReduction,
    biggestImpact,
    newExpenses,
    removedExpenses,
    text:parts.join(" ")
  };
}

async function uploadFile(key,file){
  if(!file)return;

  try{
    state.error="";

    if(key==="extrato"){
      const result=await parseStatement(file);

      state.data.extrato=result.records;
      state.balance=result.balance;
    }else{
      state.data[key]=await parseAccounts(
        file,
        key
      );
    }

    state.updated[key]=
      new Date().toISOString();

    state.filters=freshFilters();

    saveData(key);
  }catch(error){
    state.error=
      error.message||
      "Não foi possível ler o arquivo.";
  }

  render();
}

function renderEmpty(){
  const label=
    CONFIG[state.source]?.label||
    "Extrato Bancário";

  const container=createElement(
    "div",
    {class:"empty"},
    [
      createElement(
        "p",
        {},
        `Carregue o arquivo de ${label} para visualizar esta área.`
      )
    ]
  );

  const drop=createElement(
    "div",
    {class:"drop"},
    "⬆ Arraste o arquivo aqui ou clique para escolher"
  );

  const input=createElement(
    "input",
    {
      type:"file",
      accept:".xlsx,.xls,.csv",

      onchange:event=>
        uploadFile(
          state.source,
          event.target.files[0]
        )
    }
  );

  drop.onclick=()=>input.click();

  drop.ondragover=event=>{
    event.preventDefault();
    drop.classList.add("over");
  };

  drop.ondragleave=()=>{
    drop.classList.remove("over");
  };

  drop.ondrop=event=>{
    event.preventDefault();
    drop.classList.remove("over");

    uploadFile(
      state.source,
      event.dataTransfer.files[0]
    );
  };

  container.append(drop,input);
  return container;
}

              {},
              [
                sectionHeader(
                  "RANKING",
                  state.source==="pagar"
                    ?"Gastos por fornecedor"
                    :"Recebimentos por cliente"
                ),

                renderRanking(
                  records,
                  "entity",
                  "#2457a7"
                )
              ]
            ),

            createElement(
              "div",
              {},
              [
                sectionHeader(
                  "RANKING",
                  "Valores por centro de custo"
                ),

                renderRanking(
                  records,
                  "costCenter",
                  "#d89a22"
                )
              ]
            )
          ]
        )
      );
    }
  }

  app.append(
    createElement(
      "input",
      {
        id:"main-file",
        type:"file",
        accept:".xlsx,.xls,.csv",

        onchange:event=>
          uploadFile(
            state.source,
            event.target.files[0]
          )
      }
    ),

    createElement(
      "div",
      {class:"footer"},
      "Dados processados somente neste navegador · relatórios automáticos sem IA"
    )
  );
}

loadData();
render();
</script>
</body>
</html>
