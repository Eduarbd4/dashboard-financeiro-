<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Financeiro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --ink:#16233f;
  --paper:#faf7f1;
  --dim:#f1ece2;
  --gold:#bb8a34;
  --sage:#5c7a63;
  --rust:#a8462e;
  --line:#ded6c4;
  --muted:#5c5748;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Inter,sans-serif;
}

.wrap{
  max-width:1220px;
  margin:auto;
  padding:28px 24px 50px;
}

.eyebrow{
  font:11px "IBM Plex Mono";
  color:var(--gold);
  letter-spacing:.08em;
}

.title{
  font:600 27px Fraunces;
  margin:3px 0;
}

.sub{
  font:12px "IBM Plex Mono";
  opacity:.62;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:9px 14px;
  border-radius:7px;
  cursor:pointer;
  font-weight:600;
}

.btn.secondary{
  background:#fff;
  color:var(--ink);
  border-color:var(--line);
}

.btn.danger{
  background:transparent;
  color:var(--rust);
  border-color:var(--rust);
}

.tabs{
  display:flex;
  gap:4px;
  border-bottom:1px solid var(--line);
  margin-bottom:20px;
  overflow-x:auto;
}

.tab{
  white-space:nowrap;
  border:0;
  background:none;
  padding:11px 15px;
  margin-bottom:-1px;
  border-bottom:2px solid transparent;
  color:var(--muted);
  cursor:pointer;
  font:12px "IBM Plex Mono";
}

.tab.active{
  color:var(--ink);
  font-weight:600;
  border-bottom-color:var(--gold);
}

.viewtabs{
  margin-top:-8px;
  margin-bottom:22px;
}

.filterbox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  margin-bottom:22px;
}

.filters{
  display:flex;
  gap:10px;
  align-items:end;
  flex-wrap:wrap;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:145px;
}

.field label{
  font:10px "IBM Plex Mono";
  text-transform:uppercase;
  color:var(--muted);
}

.field input,
.field select{
  height:36px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  color:var(--ink);
  padding:0 9px;
  font:12px Inter;
}

.compareToggle{
  display:flex;
  align-items:center;
  gap:7px;
  height:36px;
  font-size:12px;
}

.compareDates{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  width:100%;
  padding-top:12px;
  border-top:1px solid var(--line);
}

.kpis{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:14px;
  margin-bottom:28px;
}

.kpi{
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px 13px 5px 13px;
  padding:18px;
  min-width:0;
}

.kpi.primary{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}

.kpi.late{
  background:var(--rust);
  color:#fff;
  border-color:var(--rust);
}

.kpi.gold{
  background:var(--gold);
  color:#251b08;
  border-color:var(--gold);
}

.kpi .label{
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  opacity:.75;
}

.kpi .value{
  font:600 24px Fraunces;
  margin:8px 0 5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.kpi .detail{
  font:11px "IBM Plex Mono";
  opacity:.7;
}

.section{
  display:flex;
  align-items:center;
  gap:10px;
  margin:25px 0 13px;
}

.section h2{
  font:600 19px Fraunces;
  margin:0;
}

.rule{
  height:1px;
  background:var(--line);
  flex:1;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:11px;
  padding:17px;
  margin-bottom:22px;
  overflow:hidden;
}

.chart{
  width:100%;
  overflow-x:auto;
}

.chart svg{
  display:block;
  min-width:700px;
}

.tablewrap{
  overflow-x:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:680px;
}

.table th,
.table td{
  text-align:right;
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.table th:first-child,
.table td:first-child{
  text-align:left;
}

.table th{
  font:10px "IBM Plex Mono";
  text-transform:uppercase;
  color:var(--muted);
}

.positive{color:var(--sage)}
.negative{color:var(--rust)}
.neutral{color:var(--muted)}

.analysis{
  line-height:1.65;
  font-size:13px;
}

.analysisLead{
  font:600 17px Fraunces;
  margin-bottom:12px;
}

.insights{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.insight{
  background:var(--dim);
  border-radius:7px;
  padding:12px;
}

.catgroup{
  margin-bottom:22px;
}

.cathead{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font:600 16px Fraunces;
}

.catsub{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:7px 0 7px 24px;
  color:var(--muted);
  font-size:12px;
}

.cathead span:last-child,
.catsub span:last-child{
  font-family:"IBM Plex Mono";
  white-space:nowrap;
}

.ranking{
  display:flex;
  align-items:center;
  gap:9px;
  margin:10px 0;
}

.rankname{
  width:180px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
}

.track{
  height:22px;
  background:var(--dim);
  border-radius:4px;
  flex:1;
  overflow:hidden;
}

.fill{
  height:100%;
  background:var(--ink);
  border-radius:4px;
}

.rankvalue{
  width:110px;
  text-align:right;
  font:11px "IBM Plex Mono";
}

.empty{
  text-align:center;
  max-width:680px;
  margin:45px auto;
}

.drop{
  border:2px dashed var(--line);
  border-radius:12px;
  padding:38px 20px;
  cursor:pointer;
}

.drop.over{
  border-color:var(--gold);
  background:var(--dim);
}

.error{
  color:var(--rust);
  font-size:12px;
  margin:10px 0;
}

.footer{
  text-align:center;
  font:10px "IBM Plex Mono";
  opacity:.5;
  margin-top:28px;
}

input[type=file]{display:none}

@media(max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .insights{grid-template-columns:1fr}
}

@media(max-width:600px){
  .wrap{padding:20px 14px 40px}
  .kpis{grid-template-columns:1fr}
  .actions{width:100%}
  .actions .btn{flex:1}
  .field{flex:1 1 140px}
}
</style>
</head>

<body>
<main class="wrap" id="app"></main>

<script>
const MONTHS=[
  "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
  "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
];

const MONTH_ABBR=[
  "jan","fev","mar","abr","mai","jun",
  "jul","ago","set","out","nov","dez"
];

const GROUP_LABELS={
  "2.01":"Ocupação e Instalações",
  "2.02":"Produção e Insumos",
  "2.03":"Salários, Benefícios e Encargos",
  "2.04":"Comercial e Vendas",
  "2.05":"Marketing e Publicidade",
  "2.06":"Impostos sobre Vendas",
  "2.07":"Parcelamentos Tributários",
  "2.08":"Tarifas e Encargos Bancários",
  "2.09":"Serviços Profissionais",
  "2.10":"Softwares e TI",
  "2.11":"Despesas Administrativas",
  "2.12":"Despesas Variáveis / Sócios"
};

const brl=value=>new Intl.NumberFormat("pt-BR",{
  style:"currency",
  currency:"BRL",
  maximumFractionDigits:0
}).format(Number(value)||0);

function element(tag,attributes={},children=[]){
  const item=document.createElement(tag);

  Object.entries(attributes).forEach(([key,value])=>{
    if(key.startsWith("on")){
      item.addEventListener(key.slice(2),value);
    }else if(key==="class"){
      item.className=value;
    }else if(key==="html"){
      item.innerHTML=value;
    }else{
      item.setAttribute(key,value);
    }
  });

  (Array.isArray(children)?children:[children]).forEach(child=>{
    if(child===null||child===undefined||child===false)return;

    item.appendChild(
      typeof child==="string"
        ?document.createTextNode(child)
        :child
    );
  });

  return item;
}

const normalize=value=>
  (value||"").toString().trim().toLowerCase();

function findColumn(headers,names){
  const wanted=names.map(normalize);
  return headers.findIndex(header=>wanted.includes(normalize(header)));
}

function parseNumber(value){
  if(typeof value==="number")return value;

  let text=(value||"").toString().trim();

  if(text.includes(",")&&text.lastIndexOf(",")>text.lastIndexOf(".")){
    text=text.replace(/\./g,"").replace(",",".");
  }

  const number=parseFloat(text.replace(/[^\d.-]/g,""));
  return Number.isNaN(number)?0:number;
}

function parseDate(value){
  if(value instanceof Date)return value;

  if(typeof value==="number"&&value>20000){
    const converted=new Date(Math.round((value-25569)*86400000));

    return new Date(
      converted.getUTCFullYear(),
      converted.getUTCMonth(),
      converted.getUTCDate()
    );
  }

  const text=(value||"").toString().trim();

  let match=text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);

  if(match){
    const year=match[3].length===2
      ?Number(`20${match[3]}`)
      :Number(match[3]);

    return new Date(year,Number(match[2])-1,Number(match[1]));
  }

  match=text.match(/^(\d{4})-(\d{2})-(\d{2})/);

  return match
    ?new Date(Number(match[1]),Number(match[2])-1,Number(match[3]))
    :null;
}

function dateISO(date){
  if(!date)return "";

  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

function parseCategory(raw){
  const text=(raw||"").toString().trim();
  const match=text.match(/^(\d+(?:\.\d+)+)\s*[-–.]?\s*(.*)$/);

  return match&&match[2]
    ?{code:match[1],name:match[2].trim()}
    :{
      code:"",
      name:text.replace(/^[\d.]+\s*/,"").trim()||"Sem categoria"
    };
}

async function parsePayables(file){
  const workbook=XLSX.read(await file.arrayBuffer(),{type:"array"});

  const sheetName=
    workbook.SheetNames.find(name=>/contas a pagar/i.test(name))||
    workbook.SheetNames[0];

  const worksheet=workbook.Sheets[sheetName];

  const rows=XLSX.utils.sheet_to_json(worksheet,{
    header:1,
    raw:true,
    defval:""
  });

  const headerIndex=rows.findIndex(row=>
    row.some(cell=>normalize(cell)==="nome do fornecedor")
  );

  if(headerIndex<0){
    throw new Error(
      'Não reconheci o arquivo. Envie o relatório "Visão Contas a Pagar" do Conta Azul.'
    );
  }

  const headers=rows[headerIndex];

  const columns={
    supplier:findColumn(headers,["Nome do fornecedor"]),
    dueDate:findColumn(headers,["Data de vencimento"]),
    status:findColumn(headers,["Situação"]),
    original:findColumn(headers,["Valor original da parcela (R$)"]),
    paid:findColumn(headers,["Valor total pago da parcela (R$)"]),
    open:findColumn(headers,["Valor total da parcela em aberto (R$)"]),
    costCenter:findColumn(headers,["Centro de Custo 1"])
  };

  if(columns.supplier<0||columns.dueDate<0||columns.original<0){
    throw new Error("Faltam colunas obrigatórias no arquivo.");
  }

  const categoryColumns=[];

  for(let index=1;index<=12;index++){
    const categoryIndex=findColumn(headers,[`Categoria ${index}`]);

    if(categoryIndex>=0){
      categoryColumns.push({
        categoryIndex,
        valueIndex:findColumn(headers,[`Valor na Categoria ${index}`])
      });
    }
  }

  const records=[];

  rows.slice(headerIndex+1).forEach(row=>{
    const date=parseDate(row[columns.dueDate]);
    if(!date)return;

    const original=Math.abs(parseNumber(row[columns.original]));
    const allocations=[];

    categoryColumns.forEach(column=>{
      const raw=row[column.categoryIndex];

      if(!String(raw||"").trim())return;

      const category=parseCategory(raw);

      allocations.push({
        code:category.code,
        name:category.name,
        value:Math.abs(parseNumber(row[column.valueIndex]))
      });
    });

    if(!allocations.length){
      allocations.push({
        code:"",
        name:"Sem categoria",
        value:original
      });
    }else if(!allocations.some(item=>item.value)){
      allocations[0].value=original;
    }

    const formattedDate=dateISO(date);

    records.push({
      supplier:String(row[columns.supplier]||"Sem fornecedor").trim(),
      status:String(row[columns.status]||"Não informado").trim(),
      original,
      paid:Math.abs(parseNumber(row[columns.paid])),
      open:Math.abs(parseNumber(row[columns.open])),
      costCenter:columns.costCenter>=0
        ?String(row[columns.costCenter]||"Sem centro de custo").trim()
        :"Sem centro de custo",
      allocations,
      date:formattedDate,
      month:formattedDate.slice(0,7)
    });
  });

  if(!records.length){
    throw new Error("Nenhum lançamento válido foi encontrado.");
  }

  return records;
}

function freshFilters(){
  return{
    dateFrom:"",
    dateTo:"",
    month1:"",
    month2:"",
    compare:false,
    period1From:"",
    period1To:"",
    period2From:"",
    period2To:"",
    status:"",
    supplier:"",
    category:"",
    costCenter:""
  };
}

let state={
  view:"dashboard",
  records:null,
  updated:"",
  error:"",
  filters:freshFilters()
};

function loadData(){
  try{
    const saved=JSON.parse(localStorage.getItem("dane-se-payables-v7"));

    if(saved){
      state.records=saved.records;
      state.updated=saved.updated;
    }
  }catch(error){
    console.error(error);
  }
}

function saveData(){
  localStorage.setItem("dane-se-payables-v7",JSON.stringify({
    records:state.records,
    updated:state.updated
  }));
}

function monthOptions(){
  return[...new Set((state.records||[]).map(record=>record.month))]
    .sort()
    .map(key=>({
      key,
      label:`${MONTHS[Number(key.slice(5))-1]}/${key.slice(0,4)}`
    }));
}

function baseRecords(){
  const filters=state.filters;

  return(state.records||[])
    .filter(record=>!filters.status||record.status===filters.status)
    .filter(record=>!filters.supplier||record.supplier===filters.supplier)
    .filter(record=>!filters.costCenter||record.costCenter===filters.costCenter)
    .filter(record=>
      !filters.category||
      record.allocations.some(item=>item.name===filters.category)
    );
}

function periodRecords(period=0){
  const filters=state.filters;
  let from="";
  let to="";
  let month="";

  if(filters.compare){
    if(period===1){
      from=filters.period1From;
      to=filters.period1To;
    }else{
      from=filters.period2From;
      to=filters.period2To;
    }
  }else{
    from=filters.dateFrom;
    to=filters.dateTo;

    month=period===1
      ?filters.month1
      :period===2
        ?filters.month2
        :"";
  }

  return baseRecords()
    .filter(record=>!from||record.date>=from)
    .filter(record=>!to||record.date<=to)
    .filter(record=>!month||record.month===month);
}

function currentRecords(){
  return periodRecords(
    state.filters.compare||state.filters.month2?2:1
  );
}

function variation(first,second){
  if(first===0)return second===0?0:NaN;
  return((second-first)/Math.abs(first))*100;
}

function variationText(first,second){
  const value=variation(first,second);

  if(!Number.isFinite(value))return "—";

  return`${value>0?"↑ +":value<0?"↓ ":""}${value.toFixed(1).replace(".",",")}%`;
}

function section(eyebrow,title){
  return element("div",{class:"section"},[
    element("span",{class:"eyebrow"},eyebrow),
    element("h2",{},title),
    element("div",{class:"rule"})
  ]);
}

function kpi(label,value,className="",detail=""){
  return element("div",{class:`kpi ${className}`},[
    element("div",{class:"label"},label),
    element("div",{class:"value"},value),
    detail?element("div",{class:"detail"},detail):null
  ]);
}

function selectField(label,value,options,onChange){
  const select=element("select",{onchange:event=>onChange(event.target.value)},[
    element("option",{value:""},"Todos"),
    ...options.map(option=>{
      const item=element("option",{value:option.key},option.label);
      item.selected=option.key===value;
      return item;
    })
  ]);

  return element("div",{class:"field"},[
    element("label",{},label),
    select
  ]);
}

function dateField(label,key){
  return element("div",{class:"field"},[
    element("label",{},label),
    element("input",{
      type:"date",
      value:state.filters[key],
      onchange:event=>{
        state.filters[key]=event.target.value;

        if(!state.filters.compare&&event.target.value){
          if(key==="dateFrom")state.filters.month1=event.target.value.slice(0,7);
          if(key==="dateTo")state.filters.month2=event.target.value.slice(0,7);
        }

        render();
      }
    })
  ]);
}

function renderFilters(){
  const filters=state.filters;
  const records=state.records||[];

  const options=property=>[...new Set(records.map(record=>record[property]).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"pt-BR"))
    .map(value=>({key:value,label:value}));

  const categories=[...new Set(
    records.flatMap(record=>record.allocations.map(item=>item.name))
  )]
    .sort((a,b)=>a.localeCompare(b,"pt-BR"))
    .map(value=>({key:value,label:value}));

  const row=element("div",{class:"filters"});

  if(!filters.compare){
    row.append(
      dateField("Data inicial","dateFrom"),
      dateField("Data final","dateTo"),
      selectField("Mês 1",filters.month1,monthOptions(),value=>{
        filters.month1=value;
        render();
      }),
      selectField("Mês 2",filters.month2,monthOptions(),value=>{
        filters.month2=value;
        render();
      })
    );
  }

  const checkbox=element("input",{
    type:"checkbox",
    onchange:event=>{
      filters.compare=event.target.checked;
      render();
    }
  });

  checkbox.checked=filters.compare;

  row.append(
    element("label",{class:"compareToggle"},[
      checkbox,
      "Comparar períodos"
    ])
  );

  if(filters.compare){
    row.append(
      element("div",{class:"compareDates"},[
        dateField("Período 1 — início","period1From"),
        dateField("Período 1 — fim","period1To"),
        dateField("Período 2 — início","period2From"),
        dateField("Período 2 — fim","period2To")
      ])
    );
  }

  row.append(
    selectField("Situação",filters.status,options("status"),value=>{
      filters.status=value;
      render();
    }),
    selectField("Fornecedor",filters.supplier,options("supplier"),value=>{
      filters.supplier=value;
      render();
    }),
    selectField("Categoria",filters.category,categories,value=>{
      filters.category=value;
      render();
    }),
    selectField("Centro de custo",filters.costCenter,options("costCenter"),value=>{
      filters.costCenter=value;
      render();
    }),
    element("button",{
      class:"btn secondary",
      onclick:()=>{
        state.filters=freshFilters();
        render();
      }
    },"Limpar filtros")
  );

  return element("div",{class:"filterbox"},row);
}

function totals(records){
  return{
    total:records.reduce((sum,record)=>sum+record.original,0),
    paid:records.reduce((sum,record)=>sum+record.paid,0),
    open:records
      .filter(record=>record.status==="Em aberto")
      .reduce((sum,record)=>sum+record.open,0),
    late:records
      .filter(record=>record.status==="Atrasado")
      .reduce((sum,record)=>sum+record.open,0),
    suppliers:new Set(records.map(record=>record.supplier)).size
  };
}

function monthlyData(){
  const map=new Map();

  baseRecords().forEach(record=>{
    map.set(record.month,(map.get(record.month)||0)+record.original);
  });

  return[...map.entries()]
    .sort()
    .map(([key,value])=>({
      key,
      label:`${MONTH_ABBR[Number(key.slice(5))-1]}/${key.slice(2,4)}`,
      value
    }));
}

function categoryGroups(records){
  const groups=new Map();

  records.forEach(record=>{
    record.allocations.forEach(allocation=>{
      const parts=(allocation.code||"").split(".");
      const key=parts.length>=2?parts.slice(0,2).join("."):allocation.name;
      const label=GROUP_LABELS[key]||allocation.name;

      if(!groups.has(key)){
        groups.set(key,{
          label,
          total:0,
          items:new Map()
        });
      }

      const group=groups.get(key);
      group.total+=allocation.value;

      group.items.set(
        allocation.name,
        (group.items.get(allocation.name)||0)+allocation.value
      );
    });
  });

  return[...groups.values()].sort((a,b)=>b.total-a.total);
}

function rankingMap(records,property){
  const map=new Map();

  records.forEach(record=>{
    map.set(
      record[property],
      (map.get(record[property])||0)+record.original
    );
  });

  return[...map.entries()].sort((a,b)=>b[1]-a[1]);
}

function renderChart(){
  const data=monthlyData();
  const width=1000;
  const height=280;
  const left=65;
  const bottom=35;
  const maximum=Math.max(1,...data.map(item=>item.value));
  const gap=(width-left-20)/Math.max(data.length,1);
  const barWidth=Math.min(70,gap*.62);

  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${width} ${height}`);

  data.forEach((item,index)=>{
    const barHeight=(height-bottom-20)*(item.value/maximum);
    const x=left+index*gap+(gap-barWidth)/2;
    const y=height-bottom-barHeight;

    const rectangle=document.createElementNS(svg.namespaceURI,"rect");
    rectangle.setAttribute("x",x);
    rectangle.setAttribute("y",y);
    rectangle.setAttribute("width",barWidth);
    rectangle.setAttribute("height",barHeight);
    rectangle.setAttribute("rx",4);
    rectangle.setAttribute("fill","#16233f");

    const tooltip=document.createElementNS(svg.namespaceURI,"title");
    tooltip.textContent=`${item.label}: ${brl(item.value)}`;
    rectangle.append(tooltip);
    svg.append(rectangle);

    const label=document.createElementNS(svg.namespaceURI,"text");
    label.setAttribute("x",x+barWidth/2);
    label.setAttribute("y",height-10);
    label.setAttribute("text-anchor","middle");
    label.setAttribute("font-size","10");
    label.textContent=item.label;
    svg.append(label);
  });

  return element("div",{class:"chart"},svg);
}

function renderRanking(records,property){
  const data=rankingMap(records,property);
  const maximum=Math.max(1,...data.map(item=>item[1]));

  return element("div",{class:"card"},
    data.length
      ?data.map(([name,value])=>element("div",{class:"ranking"},[
        element("div",{class:"rankname",title:name},name),
        element("div",{class:"track"},
          element("div",{
            class:"fill",
            style:`width:${(value/maximum)*100}%`
          })
        ),
        element("div",{class:"rankvalue"},brl(value))
      ]))
      :"Sem dados para os filtros atuais."
  );
}

function renderDashboard(app){
  const records=currentRecords();
  const values=totals(records);

  app.append(
    element("div",{class:"kpis"},[
      kpi("Total no período",brl(values.total),"primary",`${records.length} lançamentos`),
      kpi("Pago",brl(values.paid)),
      kpi("Em aberto",brl(values.open)),
      kpi("Atrasado",brl(values.late),values.late>0?"late":""),
      kpi("Fornecedores",String(values.suppliers),"gold")
    ]),
    section("ANO","Gastos por mês"),
    element("div",{class:"card"},renderChart()),
    section("RANKING","Gastos por fornecedor"),
    renderRanking(records,"supplier"),
    section("RANKING","Gastos por centro de custo"),
    renderRanking(records,"costCenter")
  );
}

function renderComparison(app){
  const first=totals(periodRecords(1));
  const second=totals(periodRecords(2));
  const difference=second.total-first.total;
  const percentage=variation(first.total,second.total);
  const labels=state.filters.compare
    ?[
      `${state.filters.period1From||"início"} a ${state.filters.period1To||"fim"}`,
      `${state.filters.period2From||"início"} a ${state.filters.period2To||"fim"}`
    ]
    :[
      monthOptions().find(item=>item.key===state.filters.month1)?.label||"Período 1",
      monthOptions().find(item=>item.key===state.filters.month2)?.label||"Período 2"
    ];

  const table=element("table",{class:"table"},[
    element("thead",{},element("tr",{},[
      "Indicador",labels[0],labels[1],"Diferença","Variação"
    ].map(value=>element("th",{},value)))),
    element("tbody",{},element("tr",{},[
      element("td",{},"Despesas"),
      element("td",{},brl(first.total)),
      element("td",{},brl(second.total)),
      element("td",{},brl(difference)),
      element("td",{
        class:Number.isFinite(percentage)
          ?percentage<=0?"positive":"negative"
          :"neutral"
      },variationText(first.total,second.total))
    ]))
  ]);

  app.append(
    section("COMPARAÇÃO","Comparação de despesas"),
    element("div",{class:"card tablewrap"},table)
  );

  const firstGroups=categoryGroups(periodRecords(1));
  const secondGroups=categoryGroups(periodRecords(2));
  const firstMap=new Map(firstGroups.map(group=>[group.label,group.total]));
  const secondMap=new Map(secondGroups.map(group=>[group.label,group.total]));

  const changes=[...new Set([...firstMap.keys(),...secondMap.keys()])]
    .map(name=>({
      name,
      difference:(secondMap.get(name)||0)-(firstMap.get(name)||0)
    }))
    .sort((a,b)=>b.difference-a.difference);

  const increase=changes.find(item=>item.difference>0);
  const reduction=[...changes].reverse().find(item=>item.difference<0);
  const impact=[...changes].sort(
    (a,b)=>Math.abs(b.difference)-Math.abs(a.difference)
  )[0];

  app.append(
    section("ANÁLISE","Análise do período"),
    element("div",{class:"card analysis"},[
      element("div",{class:"analysisLead"},
        Number.isFinite(percentage)
          ?`As despesas apresentaram ${Math.abs(percentage).toFixed(1).replace(".",",")}% de ${percentage<=0?"redução":"aumento"}.`
          :"Não existe base suficiente para calcular a variação."
      ),
      element("div",{class:"insights"},[
        element("div",{class:"insight"},
          `Maior aumento: ${increase?`${increase.name} (${brl(increase.difference)})`:"nenhum"}`
        ),
        element("div",{class:"insight"},
          `Maior redução: ${reduction?`${reduction.name} (${brl(Math.abs(reduction.difference))})`:"nenhuma"}`
        ),
        element("div",{class:"insight"},
          `Maior impacto: ${impact?impact.name:"sem dados"}`
        )
      ])
    ])
  );
}

function renderCategories(app){
  const groups=categoryGroups(currentRecords());

  app.append(
    section("DETALHAMENTO","Detalhamento por categoria (categoria › subcategoria)"),
    element("div",{class:"card"},
      groups.length
        ?groups.map(group=>element("div",{class:"catgroup"},[
          element("div",{class:"cathead"},[
            element("span",{},group.label),
            element("span",{},brl(group.total))
          ]),
          ...[...group.items.entries()]
            .sort((a,b)=>b[1]-a[1])
            .map(([name,value])=>element("div",{class:"catsub"},[
              element("span",{},name),
              element("span",{},brl(value))
            ]))
        ]))
        :"Sem dados para os filtros atuais."
    )
  );
}

function reportData(){
  const records=currentRecords();
  const values=totals(records);

  return{
    records,
    values,
    months:monthlyData().map(item=>[item.label,item.value]),
    suppliers:rankingMap(records,"supplier"),
    costCenters:rankingMap(records,"costCenter"),
    groups:categoryGroups(records)
  };
}

function downloadExcel(){
  const report=reportData();

  if(!report.records.length){
    alert("Não há dados para gerar o relatório.");
    return;
  }

  const workbook=XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    workbook,
    XLSX.utils.aoa_to_sheet([
      ["RELATÓRIO FINANCEIRO DANE-SE"],
      ["Gerado em",new Date().toLocaleString("pt-BR")],
      [],
      ["Indicador","Valor"],
      ["Total no período",report.values.total],
      ["Pago",report.values.paid],
      ["Em aberto",report.values.open],
      ["Atrasado",report.values.late],
      ["Fornecedores",report.values.suppliers],
      ["Lançamentos",report.records.length]
    ]),
    "Resumo"
  );

  XLSX.utils.book_append_sheet(
    workbook,
    XLSX.utils.aoa_to_sheet([
      ["Mês","Gastos"],
      ...report.months
    ]),
    "Gastos por mês"
  );

  XLSX.utils.book_append_sheet(
    workbook,
    XLSX.utils.aoa_to_sheet([
      ["Fornecedor","Valor"],
      ...report.suppliers
    ]),
    "Fornecedores"
  );

  XLSX.utils.book_append_sheet(
    workbook,
    XLSX.utils.aoa_to_sheet([
      ["Centro de custo","Valor"],
      ...report.costCenters
    ]),
    "Centros de custo"
  );

  const categories=[["Categoria","Subcategoria","Valor"]];

  report.groups.forEach(group=>{
    [...group.items.entries()].forEach(([name,value])=>{
      categories.push([group.label,name,value]);
    });
  });

  XLSX.utils.book_append_sheet(
    workbook,
    XLSX.utils.aoa_to_sheet(categories),
    "Categorias"
  );

  XLSX.writeFile(
    workbook,
    `relatorio-financeiro-${new Date().toISOString().slice(0,10)}.xlsx`
  );
}

function downloadPDF(){
  const report=reportData();

  if(!report.records.length){
    alert("Não há dados para gerar o relatório.");
    return;
  }

  if(!window.jspdf){
    alert("Não foi possível carregar o gerador de PDF.");
    return;
  }

  const{jsPDF}=window.jspdf;
  const documentPDF=new jsPDF({orientation:"landscape"});

  documentPDF.setTextColor(22,35,63);
  documentPDF.setFontSize(18);
  documentPDF.text("Dane-se - Relatório financeiro",14,16);

  documentPDF.setFontSize(9);
  documentPDF.text(
    `Gerado em ${new Date().toLocaleString("pt-BR")} | Conforme filtros ativos`,
    14,
    23
  );

  documentPDF.autoTable({
    startY:29,
    head:[[
      "Total no período",
      "Pago",
      "Em aberto",
      "Atrasado",
      "Fornecedores"
    ]],
    body:[[
      brl(report.values.total),
      brl(report.values.paid),
      brl(report.values.open),
      brl(report.values.late),
      String(report.values.suppliers)
    ]],
    headStyles:{fillColor:[22,35,63]}
  });

  documentPDF.autoTable({
    startY:documentPDF.lastAutoTable.finalY+8,
    head:[["Mês","Gastos"]],
    body:report.months.map(([month,value])=>[month,brl(value)]),
    headStyles:{fillColor:[187,138,52]}
  });

  documentPDF.autoTable({
    startY:documentPDF.lastAutoTable.finalY+8,
    head:[["Categoria","Subcategoria","Valor"]],
    body:report.groups.flatMap(group=>
      [...group.items.entries()].map(([name,value])=>[
        group.label,
        name,
        brl(value)
      ])
    ),
    headStyles:{fillColor:[92,122,99]},
    styles:{fontSize:8}
  });

  documentPDF.addPage();

  documentPDF.autoTable({
    startY:14,
    head:[["Fornecedor","Valor"]],
    body:report.suppliers.map(([name,value])=>[name,brl(value)]),
    headStyles:{fillColor:[22,35,63]},
    styles:{fontSize:8}
  });

  documentPDF.autoTable({
    startY:documentPDF.lastAutoTable.finalY+8,
    head:[["Centro de custo","Valor"]],
    body:report.costCenters.map(([name,value])=>[name,brl(value)]),
    headStyles:{fillColor:[187,138,52]},
    styles:{fontSize:8}
  });

  documentPDF.save(
    `relatorio-financeiro-${new Date().toISOString().slice(0,10)}.pdf`
  );
}

async function uploadFile(file){
  if(!file)return;

  try{
    state.error="";
    state.records=await parsePayables(file);
    state.updated=new Date().toISOString();
    state.filters=freshFilters();
    saveData();
  }catch(error){
    state.error=error.message||"Não foi possível ler o arquivo.";
  }

  render();
}

function renderEmpty(){
  const container=element("div",{class:"empty"},[
    element("p",{},
      'Envie o relatório "Visão Contas a Pagar" exportado pelo Conta Azul.'
    )
  ]);

  const drop=element("div",{class:"drop"},
    "⬆ Arraste o arquivo aqui ou clique para escolher"
  );

  const input=element("input",{
    type:"file",
    accept:".xlsx,.xls,.csv",
    onchange:event=>uploadFile(event.target.files[0])
  });

  drop.onclick=()=>input.click();

  drop.ondragover=event=>{
    event.preventDefault();
    drop.classList.add("over");
  };

  drop.ondragleave=()=>drop.classList.remove("over");

  drop.ondrop=event=>{
    event.preventDefault();
    drop.classList.remove("over");
    uploadFile(event.dataTransfer.files[0]);
  };

  container.append(drop,input);
  return container;
}

function clearData(){
  if(!confirm("Apagar todos os dados carregados?"))return;

  localStorage.removeItem("dane-se-payables-v7");
  state.records=null;
  state.updated="";
  state.filters=freshFilters();
  render();
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";

  const updated=state.updated
    ?new Date(state.updated).toLocaleString("pt-BR")
    :"—";

  app.append(
    element("div",{class:"header"},[
      element("div",{},[
        element("div",{class:"eyebrow"},"DASHBOARD FINANCEIRO"),
        element("h1",{class:"title"},"Dane-se · Painel financeiro"),
        element("div",{class:"sub"},
          state.records
            ?`Atualizado em ${updated} · ${state.records.length} lançamentos carregados`
            :"Dados processados localmente no navegador"
        )
      ]),
      element("div",{class:"actions"},[
        element("button",{class:"btn secondary",onclick:downloadPDF},"Baixar PDF"),
        element("button",{class:"btn secondary",onclick:downloadExcel},"Baixar Excel"),
        state.records
          ?element("button",{
            class:"btn",
            onclick:()=>document.getElementById("main-file").click()
          },"⟳ Atualizar dados")
          :null,
        element("button",{class:"btn danger",onclick:clearData},"🗑 Limpar")
      ])
    ])
  );

  const views=[
    ["dashboard","Dashboard"],
    ["comparacao","Comparação"],
    ["graficos","Gráficos"],
    ["categorias","Categorias"]
  ];

  app.append(
    element("div",{class:"tabs viewtabs"},
      views.map(([key,label])=>element("button",{
        class:`tab${state.view===key?" active":""}`,
        onclick:()=>{
          state.view=key;
          render();
        }
      },label))
    )
  );

  if(state.error){
    app.append(element("div",{class:"error"},`⚠ ${state.error}`));
  }

  if(!state.records){
    app.append(renderEmpty());
    return;
  }

  app.append(renderFilters());

  if(state.view==="dashboard"){
    renderDashboard(app);
  }else if(state.view==="comparacao"){
    renderComparison(app);
  }else if(state.view==="graficos"){
    app.append(
      section("ANO","Gastos por mês"),
      element("div",{class:"card"},renderChart()),
      section("RANKING","Gastos por fornecedor"),
      renderRanking(currentRecords(),"supplier"),
      section("RANKING","Gastos por centro de custo"),
      renderRanking(currentRecords(),"costCenter")
    );
  }else{
    renderCategories(app);
  }

  app.append(
    element("input",{
      id:"main-file",
      type:"file",
      accept:".xlsx,.xls,.csv",
      onchange:event=>uploadFile(event.target.files[0])
    }),
    element("div",{class:"footer"},
      "Dados processados somente neste navegador · relatórios sem IA"
    )
  );
}

loadData();
render();
</script>
