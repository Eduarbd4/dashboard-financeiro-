<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

*{box-sizing:border-box}

body{
margin:0;
background:var(--paper);
color:var(--ink);

.wrap{

.eyebrow{

.btn.ghost{

<script>

const MONTH_ABBR=[
'jan','fev','mar','abr','mai','jun',
'jul','ago','set','out','nov','dez'
];

const MONTH_FULL=[
'Janeiro','Fevereiro','Março','Abril',
'Maio','Junho','Julho','Agosto',
'Setembro','Outubro','Novembro','Dezembro'
];

const brl=(v)=>new Intl.NumberFormat(
'pt-BR',
{
style:'currency',
currency:'BRL',
maximumFractionDigits:0
}
).format(v||0);

function parseNumberBR(val){
if(typeof val==='number') return val;

if(val==null||val==='') return 0;

let s=val.toString().trim();

if(
s.includes(',') &&
s.lastIndexOf(',')>s.lastIndexOf('.')
){
s=s.replace(/\./g,'').replace(',','.');
}

const n=parseFloat(
s.replace(/[^\d.\-]/g,'')
);

return isNaN(n)?0:n;
}

function el(tag,attrs={},children=[]){

const e=document.createElement(tag);

for(const k in attrs){

if(attrs[k]==null) continue;

if(k==='class'){
e.className=attrs[k];
}

else if(k==='html'){
e.innerHTML=attrs[k];
}

else if(k.startsWith('on')){
e.addEventListener(
k.slice(2),
attrs[k]
);
}

else{
e.setAttribute(k,attrs[k]);
}

}

(
Array.isArray(children)
?children
:[children]
).forEach(c=>{

if(c==null) return;

e.appendChild(
typeof c==='string'
?document.createTextNode(c)
:c
);

});

return e;
}

function findAnyCol(headers,names){

const norm=s=>
(s||'')
.toString()
.trim()
.toLowerCase();

const wanted=names.map(norm);

return headers.findIndex(
h=>wanted.includes(norm(h))
);

}

const TABS={

pagar:{
key:'pagar',
label:'Contas a Pagar',
storageKey:'dash-pagar-danese-v2',
sheetRegex:/contas a pagar/i,
entityHeaders:['Nome do fornecedor'],
doneHeaders:['Valor total pago da parcela (R$)'],
emptyEntityLabel:'Sem fornecedor identificado',
parseErrorMsg:'Não reconheci as colunas deste arquivo. Envie o export "Visão Contas a Pagar" do Conta Azul, sem editar os cabeçalhos.',
entityLabel:'Fornecedor',
entityCountLabel:'Fornecedores',
doneLabel:'Pago',

chartTitle:'Gastos por mês',
rankEntityTitle:'Gastos por fornecedor',

},

entityHeaders:[

],

],

entityLabel:'Cliente',
entityCountLabel:'Clientes',
doneLabel:'Recebido',
openLabel:'A receber',
lateLabel:'Atrasado',
chartTitle:'Recebimentos por mês',
rankEntityTitle:'Recebimentos por cliente',
rankCategoryTitle:'Recebimentos por categoria',
rankCentroTitle:'Recebimentos por centro de custo',
emptyHint:'Envie o arquivo exportado do Conta Azul ("Visão Contas a Receber") para montar o painel.',
chartColor:'#5C7A63'
}

};

async function parseContasGeneric(file,cfg){

const buf=await file.arrayBuffer();

const wb=XLSX.read(
buf,
{type:'array'}
);

const sheetName=
wb.SheetNames.find(
n=>cfg.sheetRegex.test(n)
)
||wb.SheetNames[0];

const ws=wb.Sheets[sheetName];

const rows=XLSX.utils.sheet_to_json(
ws,
{
header:1,
raw:true,
defval:''
}
);

const headerIdx=rows.findIndex(
r=>
Array.isArray(r)
&&
cfg.entityHeaders.some(
name=>r.some(
c=>
(c||'')
.toString()
.trim()
===name
)
)
);

if(headerIdx===-1){
throw new Error(cfg.parseErrorMsg);
}

const headers=rows[headerIdx];

const col={

entidade:findAnyCol(
headers,
cfg.entityHeaders
),

vencimento:findAnyCol(
headers,
['Data de vencimento']
),

situacao:findAnyCol(
headers,
['Situação']
),

valorOriginal:findAnyCol(
headers,
['Valor original da parcela (R$)']
),

valorFeito:findAnyCol(
headers,
cfg.doneHeaders
),

valorAberto:findAnyCol(
headers,
['Valor total da parcela em aberto (R$)']
),

categoria:findAnyCol(
headers,
['Categoria 1']
),

centro:findAnyCol(
headers,
['Centro de Custo 1']
)

};

if(
col.entidade===-1
||
col.vencimento===-1
||
col.valorOriginal===-1
){
throw new Error(cfg.parseErrorMsg);
}

const records=[];

for(
let i=headerIdx+1;
i<rows.length;
i++
){

const r=rows[i];

if(!r||r.length===0){
continue;
}

const venc=
(r[col.vencimento]||'')
.toString()
.trim();

if(
!venc
||
!venc.includes('/')
){
continue;
}

const parts=venc.split('/');

const mm=parts[1];
const yyyy=parts[2];

if(!yyyy||!mm){
continue;
}

const entidade=
(r[col.entidade]||'')
.toString()
.trim()
||
cfg.emptyEntityLabel;

const situacao=
(r[col.situacao]||'Não informado')
.toString()
.trim()
||
'Não informado';

const catRaw=
col.categoria>-1
?
(r[col.categoria]||'').toString()
:'';

const categoria=
catRaw
.replace(/^[\d.]+\s\*/,'')
.trim()
||
'Sem categoria';

const centro=
col.centro>-1
?
(
(r[col.centro]||'')
.toString()
.trim()
||
'Sem centro de custo'
)
:null;

const valorOriginal=
Number(r[col.valorOriginal])
||0;

const valorFeito=
col.valorFeito>-1
?
(Number(r[col.valorFeito])||0)
:0;

const valorAberto=
col.valorAberto>-1
?
(Number(r[col.valorAberto])||0)
:0;

const dd=parts[0]||'01';

const mesPad=
String(
parseInt(mm,10)
).padStart(2,'0');

const diaPad=
String(
parseInt(dd,10)||1
).padStart(2,'0');

records.push({

entidade,
situacao,
categoria,
centro,
valorOriginal,
valorFeito,
valorAberto,

mesNum:parseInt(mm,10),

ano:parseInt(yyyy,10),

mesKey:
`${yyyy}-${mesPad}`,

dateISO:
`${yyyy}-${mesPad}-${diaPad}`

});

}

if(records.length===0){

throw new Error(
'Não encontrei linhas de lançamento válidas neste arquivo.'
);

}

return records;
}

const EXTRATO_CFG={

dataHeaders:[
'Data',
'Data do Lançamento',
'Data Lançamento',
'Data lançamento',
'Data lancamento'
],

descHeaders:[
'Descrição',
'Histórico',
'Descricao',
'Historico',
'Complemento',
'Detalhes'
],

valorHeaders:[
'Valor',
'Valor (R$)',
'Valor R$',
'Valor da Transação',
'Valor da transacao',
'Montante'
],

tipoHeaders:[
'Tipo',
'Natureza',
'D/C',
'Tipo Lançamento',
'Tipo lancamento'
],

saldoHeaders:[
'Saldo',
'Saldo (R$)',
'Saldo Final',
'Saldo final'
]

};

function parseExtratoDate(raw){

if(raw instanceof Date){

return {
dd:raw.getDate(),
mm:raw.getMonth()+1,
yyyy:raw.getFullYear()
};

}

const s=
(raw||'')
.toString()
.trim();

if(!s){
return null;
}

if(s.includes('/')){

const [dd,mm,yyyy]=s.split('/');

if(yyyy&&mm){

return {
dd:parseInt(dd,10),
mm:parseInt(mm,10),
yyyy:parseInt(
yyyy.length===2
?'20'+yyyy
:yyyy,
10
)
};

}

}

else if(s.includes('-')){

const p=s.split('-');

if(p[0].length===4){

return {
dd:parseInt(p[2],10),
mm:parseInt(p[1],10),
yyyy:parseInt(p[0],10)
};

}

}

else if(
!isNaN(Number(s))
&&
Number(s)>20000
&&
Number(s)<60000
){

const d=
new Date(
Math.round(
(Number(s)-25569)
*86400
*1000
)
);

return {
dd:d.getUTCDate(),
mm:d.getUTCMonth()+1,
yyyy:d.getUTCFullYear()
};

}

return null;
}

async function parseExtrato(file){

const buf=await file.arrayBuffer();

const wb=XLSX.read(
buf,
{type:'array'}
);

const sheetName=
wb.SheetNames.find(
n=>/extrato/i.test(n)
)
||
wb.SheetNames[0];

const ws=wb.Sheets[sheetName];

const rows=
XLSX.utils.sheet_to_json(
ws,
{
header:1,
raw:true,
defval:''
}
);

const cfg=EXTRATO_CFG;

const headerIdx=
rows.findIndex(
r=>
Array.isArray(r)
&&
cfg.dataHeaders.some(
name=>
r.some(
c=>
(c||'')
.toString()
.trim()
===name
)
)
&&
cfg.valorHeaders.some(
name=>
r.some(
c=>
(c||'')
.toString()
.trim()
===name
)
)
);

const errMsg=
'Não reconheci as colunas deste extrato. Preciso de pelo menos uma coluna de Data e uma de Valor (exportação em .xlsx ou .csv — OFX ainda não é suportado).';

if(headerIdx===-1){
throw new Error(errMsg);
}

const headers=rows[headerIdx];

const col={

data:findAnyCol(
headers,
cfg.dataHeaders
),

desc:findAnyCol(
headers,
cfg.descHeaders
),

valor:findAnyCol(
headers,
cfg.valorHeaders
),

tipo:findAnyCol(
headers,
cfg.tipoHeaders
),

saldo:findAnyCol(
headers,
cfg.saldoHeaders
)

};

if(
col.data===-1
||
col.valor===-1
){
throw new Error(errMsg);
}

const records=[];
let lastSaldo=null;

for(
let i=headerIdx+1;
i<rows.length;
i++
){

const r=rows[i];

if(!r||r.length===0){
continue;
}

const d=
parseExtratoDate(
r[col.data]
);

if(!d){
continue;
}

const valor=
parseNumberBR(
r[col.valor]
);

const descricao=
(
col.desc>-1
?
(r[col.desc]||'')
.toString()
.trim()
:''
)
||
'Sem descrição';

let tipo;

if(col.tipo>-1){

const t=
(r[col.tipo]||'')
.toString()
.trim()
.toLowerCase();

if(t.startsWith('d')){
tipo='saida';
}

else if(t.startsWith('c')){
tipo='entrada';
}

else{
tipo=
valor<0
?'saida'
:'entrada';
}

}

else{

tipo=
valor<0
?'saida'
:'entrada';

}

if(
col.saldo>-1
&&
r[col.saldo]!==''
){

lastSaldo=
parseNumberBR(
r[col.saldo]
);

}

const mesPad=
String(d.mm)
.padStart(2,'0');

const diaPad=
String(d.dd||1)
.padStart(2,'0');

records.push({

descricao,
tipo,

valorAbs:
Math.abs(valor),

mesNum:d.mm,

ano:d.yyyy,

mesKey:
`${d.yyyy}-${mesPad}`,

dateISO:
`${d.yyyy}-${mesPad}-${diaPad}`

});

}

if(records.length===0){

throw new Error(
'Não encontrei lançamentos válidos neste extrato.'
);

}

return {
records,
saldoFinal:lastSaldo
};

}

prompt
})
}
);

data=await response.json();
}

catch(e){

throw new Error(
'O servidor retornou uma resposta inválida. Verifique a API da Vercel.'
);

function renderMonthlyChart(
data,
highlightKey,
color
){

const w=1000;
const h=230;
const padL=64;
const padB=26;
const padT=10;

const max=
Math.max(
...data.map(d=>d.valor),
1
);

const gap=
(w-padL-20)
/
Math.max(data.length,1);

const barW=
gap*.6;

const svg=
document.createElementNS(
'http://www.w3.org/2000/svg',
'svg'
);

svg.setAttribute(
'viewBox',
`0 0 ${w} ${h}`
);

svg.setAttribute(
'width',
'100%'
);

svg.setAttribute(
'preserveAspectRatio',
'xMidYMid meet'
);

for(let i=0;i<=4;i++){

const y=
padT+
(h-padT-padB)
*(1-i/4);

const line=
document.createElementNS(
'http://www.w3.org/2000/svg',
'line'
);

line.setAttribute('x1',padL);
line.setAttribute('x2',w-10);
line.setAttribute('y1',y);
line.setAttribute('y2',y);
line.setAttribute('stroke','#EFEAE0');

svg.appendChild(line);

const t=
document.createElementNS(
'http://www.w3.org/2000/svg',
'text'
);

t.setAttribute('x',padL-8);
t.setAttribute('y',y+3);
t.setAttribute('text-anchor','end');
t.setAttribute('font-family','IBM Plex Mono');
t.setAttribute('font-size','9');
t.setAttribute('fill','#5C5748');

t.textContent=
brl(
max*(i/4)
);

svg.appendChild(t);

}

data.forEach((d,i)=>{

const bh=
(h-padT-padB)
*(d.valor/max);

const x=
padL+
i*gap+
(gap-barW)/2;

const y=
h-padB-bh;

const rect=
document.createElementNS(
'http://www.w3.org/2000/svg',
'rect'
);

rect.setAttribute('x',x);
rect.setAttribute('y',y);
rect.setAttribute('width',barW);
rect.setAttribute('height',bh);
rect.setAttribute('rx',3);

rect.setAttribute(
'fill',
d.key===highlightKey
?'#BB8A34'
:color
);

const title=
document.createElementNS(
'http://www.w3.org/2000/svg',
'title'
);

title.textContent=
`${d.mes}: ${brl(d.valor)}`;

rect.appendChild(title);

svg.appendChild(rect);

const t=
document.createElementNS(
'http://www.w3.org/2000/svg',
'text'
);

t.setAttribute(
'x',
x+barW/2
);

t.setAttribute(
'y',
h-8
);

t.setAttribute(
'text-anchor',
'middle'
);

t.setAttribute(
'font-family',
'IBM Plex Mono'
);

t.setAttribute(
'font-size',
'9.5'
);

t.setAttribute(
'fill',
'#5C5748'
);

t.textContent=d.mes;

svg.appendChild(t);

});

return svg;

}

line.setAttribute('y2',y);

const t=
document.createElementNS(
'http://www.w3.org/2000/svg',
'text'
);

data.forEach((d,i)=>{

padL+
i*gap+
gap/2;

[
['entrada','#5C7A63'],

].forEach(
([key,color],j)=>{

const val=d[key];

(h-padT-padB)
*(val/max);

const x=
cx-barW-2
+
j*(barW+4);

const y=
h-padB-bh;

const rect=
document.createElementNS(
'http://www.w3.org/2000/svg',
'rect'
);

rect.setAttribute('x',x);
rect.setAttribute('y',y);
rect.setAttribute('width',barW);
rect.setAttribute('height',bh);
rect.setAttribute('rx',3);
rect.setAttribute('fill',color);

const title=
document.createElementNS(
'http://www.w3.org/2000/svg',
'title'
);

`${d.mes} · ${

?'Entradas'
:'Saídas'
}: ${brl(val)}`;

svg.appendChild(rect);

}
);

const t=
document.createElementNS(
'http://www.w3.org/2000/svg',
'text'
);

t.setAttribute('x',cx);
t.setAttribute('y',h-8);
t.setAttribute('text-anchor','middle');
t.setAttribute('font-family','IBM Plex Mono');
t.setAttribute('font-size','9.5');
t.setAttribute('fill','#5C5748');

});

return svg;

}

async function onFileContas(
key,
file
){

if(!file){
return;
}

const st=
appState.data[key];

st.error='';

try{

const recs=
await parseContasGeneric(
file,
TABS[key]
);

st.records=recs;

st.updatedAt=
new Date().toISOString();

st.f={
situacao:'Todas',
mes:'Todos',
entidade:'Todos',
categoria:'Todas',
centro:'Todos'
};

st.analysis=
blankAnalysis();

await saveTab(key);

}

catch(e){

st.error=
e.message
||
'Não foi possível ler este arquivo.';

}

render();

if(st.records){
gerarAnalise(key);
}

}

async function onResetContas(key){

if(

){

try{

if(window.storage){

await window.storage.delete(
TABS[key].storageKey,
false
);

}

}

catch(e){}

appState.data[key]={

records:null,

updatedAt:null,

error:'',

f:{

mes:'Todos',
entidade:'Todos',
categoria:'Todas',
centro:'Todos'
},

analysis:blankAnalysis()

};

render();

}

function monthLabel(key){

if(!key){
return '—';
}

const [y,m]=
key.split('-');

return `${
MONTH_FULL[
parseInt(m,10)-1
]
}/${y}`;

}

function monthBounds(key){

if(!key){

return {
start:'',
end:''
};

}

const [y,m]=
key
.split('-')
.map(Number);

const last=
new Date(
y,
m,
0
).getDate();

return {

start:
`${y}-${String(m).padStart(2,'0')}-01`,

end:
`${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}`

};

}

function pctVar(a,b){

if(a===0){

return b===0
?0
:null;

}

return (
(b-a)
/
Math.abs(a)
)*100;

}

function fmtPct(v){

if(
v==null
||
!isFinite(v)
){
return '—';
}

return `${
v>=0
?'+'
:''
}${
v.toLocaleString(
'pt-BR',
{
minimumFractionDigits:1,
maximumFractionDigits:1
}
)
}%`;

}

function changeNode(
v,
positiveIsGood=true
){

if(
v==null
||
!isFinite(v)
){

return el(
'div',
{
class:
'kpiChange neu'
},
'— sem base de comparação'
);

}

const good=
positiveIsGood
?v>=0
:v<=0;

const cls=
Math.abs(v)<0.0001
?'neu'
:(
good
?'pos'
:'neg'
);

const arrow=
Math.abs(v)<0.0001
?'→'
:(
v>0
?'↑'
:'↓'
);

return el(
'div',
{
class:
`kpiChange ${cls}`
},
`${arrow} ${fmtPct(v)}`
);

}

function recordDate(r){

if(r.dateISO){
return r.dateISO;
}

if(r.mesKey){
return `${r.mesKey}-01`;
}

return '';

}

function between(
rec,
start,
end
){

const d=
recordDate(rec);

if(!d){
return true;
}

if(
start
&&
d<start
){
return false;
}

if(
end
&&
d>end
){
return false;
}

return true;

}

function periodMetrics(
start,
end
){

const rec=
(
appState.data.receber.records
||
[]
)
.filter(
r=>
between(
r,
start,
end
)
);

const pag=
(
appState.data.pagar.records
||
[]
)
.filter(
r=>
between(
r,
start,
end
)
);

const faturamento=
rec.reduce(
(s,r)=>s+r.valorOriginal,
0
);

const despesas=
pag.reduce(
(s,r)=>s+r.valorOriginal,
0
);

const resultado=
faturamento-despesas;

const margem=
faturamento
?
resultado/faturamento*100
:0;

return {

faturamento,
despesas,
resultado,
margem,

receber:rec,
pagar:pag

};

}

function analysisPeriod(
a,
b,
p1,
p2
){

if(!b){
return null;
}

const resVar=
pctVar(
a.resultado,
b.resultado
);

const fatVar=
pctVar(
a.faturamento,
b.faturamento
);

const despVar=
pctVar(
a.despesas,
b.despesas
);

const cats1=
new Map(
categoryTotals(
a.pagar
)
);

const cats2=
new Map(
categoryTotals(
b.pagar
)
);

const catNames=
new Set([
...cats1.keys(),
...cats2.keys()
]);

const deltas=
[...catNames]
.map(n=>({

n,

a:
cats1.get(n)||0,

b:
cats2.get(n)||0,

d:
(cats2.get(n)||0)
-
(cats1.get(n)||0)

}))
.sort(
(x,y)=>y.d-x.d
);

const maiorAumento=
deltas.find(
x=>x.d>0
);

const maiorReducao=
[...deltas]
.reverse()
.find(
x=>x.d<0
);

const impact=
[...deltas]
.sort(
(x,y)=>
Math.abs(y.d)
-
Math.abs(x.d)
)[0];

const lead=
`${p2.label} apresentou ${
resVar==null
?'variação sem base comparável'
:`${Math.abs(resVar).toLocaleString(
'pt-BR',
{
maximumFractionDigits:1
}
)}% ${
resVar>=0
?'de melhora'
:'de redução'
} no resultado`
} em relação a ${p1.label}.`;

const box=
el(
'div',
{
class:'analysisPeriod'
},
[

el(
'div',
{
class:'analysisLead'
},
lead
),

el(
'div',
{
class:'analysisList'
},
[

el(
'div',
{
class:'analysisItem'
},
[
'Faturamento: ',
changeNode(
fatVar,
true
)
]
),

el(
'div',
{
class:'analysisItem'
},
[
'Despesas: ',
changeNode(
despVar,
false
)
]
),

el(
'div',
{
class:'analysisItem'
},
[
'Resultado: ',
changeNode(
resVar,
true
)
]
),

el(
'div',
{
class:'analysisItem'
},
`Maior aumento de despesa: ${
maiorAumento
?
`${maiorAumento.n} (${brl(maiorAumento.d)})`
:
'nenhum aumento identificado'
}`
),

el(
'div',
{
class:'analysisItem'
},
`Maior redução de despesa: ${
maiorReducao
?
`${maiorReducao.n} (${brl(Math.abs(maiorReducao.d))})`
:
'nenhuma redução identificada'
}`
),

el(
'div',
{
class:'analysisItem'
},
`Categoria de maior impacto: ${
impact
?
`${impact.n} (${impact.d>=0?'+':''}${brl(impact.d)})`
:
'sem dados'
}`
)

]
)

]
);

return box;

}

data:{

labels:
top.map(
x=>x[0]
),

datasets:[

{
label:'Despesas',

data:
top.map(
x=>x[1]
)

}

]

},

options:{

responsive:true,

maintainAspectRatio:false,

indexAxis:
useDoughnut
?undefined
:'y',

plugins:{

tooltip:{

callbacks:{

label:
c=>brl(c.raw)

}

}

}

}

}
);

}
)
);

grid.appendChild(
chartCard(
'Evolução das despesas',
canvas=>
makeChart(
canvas,
{

type:'line',

data:{

labels:
monthly.map(
x=>x.label
),

datasets:[

{
label:'Despesas',

data:
monthly.map(
x=>x.despesas
),

tension:.28

}

]

},

options:{

responsive:true,

maintainAspectRatio:false,

plugins:{

tooltip:{

callbacks:{

label:
c=>brl(c.raw)

}

}

}

}

}
)
)
);

return grid;

}

function renderGeneral(){

const app=
document.getElementById('app');

const pagarOk=
(
appState.data.pagar.records
||
[]
).length>0;

const receberOk=
(
appState.data.receber.records
||
[]
).length>0;

if(
!pagarOk
&&
!receberOk
){

app.appendChild(
el(
'div',
{
class:'emptyGeneral'
},
[

'Para montar a Visão Geral, carregue os relatórios nas abas ',

el(
'strong',
{},
'Contas a Receber'
),

' e ',

el(
'strong',
{},
'Contas a Pagar'
),

'. Depois volte aqui. As abas atuais continuam funcionando normalmente.'

]
)
);

return;

}

app.appendChild(
renderGeneralFilters()
);

const hasLegacy=[
...(
appState.data.pagar.records
||
[]
),
...(
appState.data.receber.records
||
[]
)
].some(
r=>!r.dateISO
);

if(hasLegacy){

app.appendChild(
el(
'div',
{
class:'mutedNote',
style:
'margin:-10px 0 18px;'
},
'Para filtros de dia exatos nos dados já salvos anteriormente, atualize os relatórios uma vez. Os novos uploads passam a guardar a data completa de vencimento.'
)
);

}

const views=[

[
'dashboard',
'Dashboard'
],

[
'detalhamento',
'Detalhamento'
],

[
'graficos',
'Gráficos'
]

];

app.appendChild(
el(
'div',
{
class:'subtabbar'
},
views.map(
([k,l])=>
el(
'button',
{
class:
'subtabbtn'
+
(
appState.generalView===k
?' active'
:''
),

onclick:()=>{

appState.generalView=k;

render();

}

},
l
)
)
)
);

const {
p1,
p2
}
=
effectivePeriods();

const a=
periodMetrics(
p1.start,
p1.end
);

const b=
p2
?
periodMetrics(
p2.start,
p2.end
)
:null;

if(
appState.generalView==='dashboard'
){

app.appendChild(
el(
'div',
{
class:'kpis'
},
[

kpiCompare(
'Faturamento',
b
?b.faturamento
:a.faturamento,
b
?a.faturamento
:null,
'money',
true,
'ink'
),

kpiCompare(
'Despesas',
b
?b.despesas
:a.despesas,
b
?a.despesas
:null,
'money',
false,
'rust'
),

kpiCompare(
'Resultado',
b
?b.resultado
:a.resultado,
b
?a.resultado
:null,
'money',
true,
(
b
?b.resultado
:a.resultado
)<0
?'rust'
:'gold'
),

kpiCompare(
'Margem',
b
?b.margem
:a.margem,
b
?a.margem
:null,
'pct',
true,
'paper'
)

]
)
);

if(b){

app.appendChild(
sectionHead(
'COMPARAÇÃO',
'Análise do período'
)
);

app.appendChild(
analysisPeriod(
a,
b,
p1,
p2
)
);

}

app.appendChild(
sectionHead(
'RESUMO',
'Comparação dos períodos'
)
);

app.appendChild(
renderComparisonTable(
a,
b,
p1,
p2
)
);

if(
!pagarOk
||
!receberOk
){

app.appendChild(
el(
'div',
{
class:'mutedNote'
},
'Atenção: a Visão Geral está parcial porque uma das bases (Pagar ou Receber) ainda não foi carregada.'
)
);

}

}

else if(
appState.generalView==='detalhamento'
){

app.appendChild(
sectionHead(
'DETALHAMENTO',
'Comparação financeira'
)
);

app.appendChild(
renderComparisonTable(
a,
b,
p1,
p2
)
);

const cats=
b
?
categoryTotals(
b.pagar
)
:
categoryTotals(
a.pagar
);

if(cats.length){

const tbl=
el(
'table',
{
class:'compareTable'
}
);

tbl.appendChild(
el(
'thead',
{},
el(
'tr',
{},
[

el(
'th',
{},
'Categoria de despesa'
),

el(
'th',
{},
b
?p2.label
:p1.label
),

el(
'th',
{},
'Participação'
)

]
)
)
);

const total=
(
b
?b
:a
).despesas
||1;

const body=
el('tbody');

cats.forEach(
([n,v])=>
body.appendChild(
el(
'tr',
{},
[

el(
'td',
{},
n
),

el(
'td',
{},
brl(v)
),

el(
'td',
{},
`${(
v/total*100
).toFixed(1)}%`
)

]
)
)
);

tbl.appendChild(body);

app.appendChild(
el(
'div',
{
class:'tableWrap',
style:
'margin-top:18px;'
},
tbl
)
);

}

}

else{

app.appendChild(
renderChartsView(
a,
b,
p1,
p2
)
);

}

}

function render(){

destroyCharts();

const app=
document.getElementById('app');

app.innerHTML='';

app.appendChild(
el(
'div',
{},
[

el(
'div',
{
class:'eyebrow'
},
'DASHBOARD FINANCEIRO'
),

el(
'h1',
{},
'DANE SE · Painel financeiro'
)

]
)
);

const tabDefs=[

{
key:'geral',
label:'Visão Geral'
},

{
key:'pagar',
label:'Contas a Pagar'
},

{
key:'receber',
label:'Contas a Receber'
},

{
key:'extrato',
label:'Extrato Bancário'
}

];

app.appendChild(
el(
'div',
{
class:'tabbar'
},
tabDefs.map(
t=>
el(
'button',
{
class:
'tabbtn'
+
(
appState.activeTab===t.key
?' active'
:''
),

onclick:()=>{

appState.activeTab=t.key;

render();

}

},
t.label
)
)
)
);

if(
appState.activeTab==='geral'
){

renderGeneral();

}

else if(
appState.activeTab==='extrato'
){

renderExtratoTab();

}

else{

renderContasTab(
appState.activeTab
);

}

}

document
.getElementById('app')
.innerHTML=
'<div style="padding:60px 0;text-align:center;font-family:\'IBM Plex Mono\',monospace;font-size:12px;opacity:.5;">Carregando dados salvos…</div>';

(async()=>{

await loadAll();

render();

})();

</script>

</body>
</html>
